 const saved=localStorage.getItem("talkabee-bird-voice-"+currentLang())||"";

let birdSceneAudio=null;
function playBirdSceneSound(key){
  const url=birdSceneSounds[key];
  if(!url)return;
  if(birdSceneAudio){
    birdSceneAudio.pause();

  }
  birdSceneAudio=new Audio(url);
  birdSceneAudio.volume=.82;
  birdSceneAudio.play().catch(()=>{});
}

function speak(t,rate=.82){
  if(!t)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang=LANGS[currentLang()].code;
    u.rate=rate;
    const v=speechSynthesis.getVoices().find(v=>v.name===voiceSelect.value);
    if(v)u.voice=v;
    setTimeout(()=>speechSynthesis.speak(u),40);
  }catch(e){}
}
