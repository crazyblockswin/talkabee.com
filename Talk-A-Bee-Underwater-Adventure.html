const challengeOrder=["shark","turtle","starfish","eel","octopus","bee"];
const lessonOrder=["dive","reef","fish","animals","gear","ocean"];
const SOUND_MAP={dolphin:"sounds/dolphin.mp3",tropicalfish:"sounds/whale.mp3",grandma:"sounds/scuba-diver.mp3",grandpa:"sounds/scuba-diver.mp3"};

const langSel=document.getElementById("lang"), voiceSel=document.getElementById("voice");
const savedLanguage=localStorage.getItem("talkabee-learn-language");
if(savedLanguage && WORDS[savedLanguage]) langSel.value=savedLanguage;
const title=document.getElementById("title"), prompt=document.getElementById("prompt"), line=document.getElementById("line");
const translation=document.getElementById("translation"), status=document.getElementById("status"), world=document.getElementById("world");
let lastWord="reef", activeLesson="", lessonPhrase=1, challenge=-1, lastSpoken="";

function voices(){return ("speechSynthesis" in window)?speechSynthesis.getVoices():[]}
function fillVoices(){
 const old=localStorage.getItem("talkabee-underwater-voice-"+langSel.value)||"";
 voiceSel.innerHTML='<option value="">Browser Default</option>';
 voices().forEach(v=>{
  const o=document.createElement("option");
  o.value=v.name;
  o.textContent=v.name+(v.lang?" — "+v.lang:"");
  voiceSel.appendChild(o);
 });
 if([...voiceSel.options].some(o=>o.value===old))voiceSel.value=old;
}
if("speechSynthesis" in window){
 speechSynthesis.onvoiceschanged=fillVoices;
 fillVoices();
 setTimeout(fillVoices,150);
 setTimeout(fillVoices,600);
 setTimeout(fillVoices,1500);
}
voiceSel.onchange=()=>localStorage.setItem("talkabee-underwater-voice-"+langSel.value,voiceSel.value);

function speak(text,rate=.88,onend=null){
 if(!text){if(onend)onend();return}
 if(!("speechSynthesis" in window)){if(onend)onend();return}
 speechSynthesis.cancel();
 setTimeout(()=>{
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SPEECH_LANG[langSel.value]||langSel.value;
  u.rate=rate;
  const v=speechSynthesis.getVoices().find(x=>x.name===voiceSel.value);
  if(v)u.voice=v;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);
 },50);
 lastSpoken=text;
}
function stopSound(){
 document.querySelectorAll("audio[data-talkabee-sound]").forEach(a=>{a.pause();a.currentTime=0;a.remove()});
}
function playSound(key){
 stopSound();const src=SOUND_MAP[key];if(!src)return;
 const a=new Audio(src);a.dataset.talkabeeSound="1";document.body.appendChild(a);a.play().catch(()=>{});
 a.onended=()=>a.remove();
}
function showWord(key){
 activeLesson="";lastWord=key;lessonPhrase=1;
 title.textContent="Click & Discover";prompt.textContent="You found "+(EN[key]||key)+".";
 line.textContent=WORDS[langSel.value][key]||EN[key]||key;
 translation.textContent=langSel.value==="en"?"":(EN[key]||key);
}
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{
 const key=b.dataset.word;showWord(key);
 let played=false;const after=()=>{if(played)return;played=true;playSound(key)};
 speak(WORDS[langSel.value][key]||EN[key]||key,.82,after);setTimeout(after,1500);
 if(challenge>=0){
  if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.color="#9dffbf"}
  else{status.textContent="Not that one — keep looking.";status.style.color="#ffe28a"}
 }
});

function clearChallenge(){
 challenge=-1;world.classList.remove("challenge-mode");
 document.querySelectorAll(".hotspot").forEach(h=>h.classList.remove("target"));
 status.textContent="";
}
document.getElementById("discovery").onclick=()=>{

};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{
 activeLesson="";lastWord="";challenge=+b.dataset.ch;world.classList.add("challenge-mode");
 document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));
 title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^\d+\.\s*/,"");
 line.textContent=WORDS[langSel.value][challengeOrder[challenge]];translation.textContent=langSel.value==="en"?"":EN[challengeOrder[challenge]];
 status.textContent="";
});

function showLesson(key,speakIt=false){
 clearChallenge();activeLesson=key;lastWord="";lessonPhrase=Math.max(0,Math.min(1,lessonPhrase));
 const a=lessons[langSel.value][key], e=lessons.en[key], btn=document.querySelector(`[data-lesson="${key}"]`);
 title.textContent=btn?btn.textContent.replace(/^\d+\.\s*/,""):"Underwater Adventure";
 prompt.textContent=a[0];line.textContent=a[lessonPhrase];translation.textContent=langSel.value==="en"?"":e[lessonPhrase];
 if(speakIt)speak(a[lessonPhrase]);
}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{lessonPhrase=1;showLesson(b.dataset.lesson,true)});

function currentSpeechText(){
 if(activeLesson)return lessons[langSel.value][activeLesson][lessonPhrase];
 if(lastWord)return WORDS[langSel.value][lastWord]||EN[lastWord];
 return line.textContent;
}
document.getElementById("normal").onclick=()=>speak(currentSpeechText(),.82);
document.getElementById("slow").onclick=()=>speak(currentSpeechText(),.58);
document.getElementById("replay").onclick=()=>speak(lastSpoken||currentSpeechText(),.82);
document.getElementById("nextPhrase").onclick=()=>{
 if(!activeLesson){const i=Math.max(0,Object.keys(EN).indexOf(lastWord));const keys=Object.keys(EN);showWord(keys[(i+1)%keys.length]);speak(currentSpeechText(),.82);return}
 lessonPhrase=(lessonPhrase+1)%2;showLesson(activeLesson,true);
};
langSel.onchange=()=>{
 localStorage.setItem("talkabee-learn-language",langSel.value);
 fillVoices();
 if(activeLesson)showLesson(activeLesson,false);
 else if(lastWord)showWord(lastWord);
};
document.getElementById("sceneView").onclick=()=>document.body.classList.add("scene-view");
document.getElementById("sceneReturn").onclick=()=>document.body.classList.remove("scene-view");

showWord("reef");
</script>
</body>
</html>
