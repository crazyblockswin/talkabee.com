let boardwalkSound=null;
function playBoardwalkSound(id){
  const file=boardwalkSounds[id];
  if(!file)return;
  if(boardwalkSound){boardwalkSound.pause();boardwalkSound.currentTime=0;}
  boardwalkSound=new Audio("sounds/"+file);
  boardwalkSound.play().catch(()=>{});
}

const challengeOrder=["ferris","carousel","lifeguard","kite","icecream","dog"];
const langSel=document.getElementById("lang"),voiceSel=document.getElementById("voice");
langSel.value=localStorage.getItem("talkabee-learn-language")||"es";
const title=document.getElementById("title"),prompt=document.getElementById("prompt"),line=document.getElementById("line"),translation=document.getElementById("translation"),status=document.getElementById("status"),world=document.getElementById("world");
let lastWord="ferris",challenge=-1;
function selectedVoice(){
 const vs=speechSynthesis.getVoices()||[];
 return vs.find(v=>v.voiceURI===voiceSel.value)||null;
}
function voiceStorageKey(){return "talkabee-voice-"+langSel.value}
function refreshVoices(){
 if(!("speechSynthesis" in window))return;
 const vs=speechSynthesis.getVoices()||[];
 if(!vs.length)return;
 const saved=localStorage.getItem(voiceStorageKey())||"";
 voiceSel.innerHTML='<option value="">Browser Default Voice</option>';
 vs.forEach(v=>voiceSel.add(new Option(v.name+" — "+(v.lang||""),v.voiceURI)));
 if([...voiceSel.options].some(o=>o.value===saved))voiceSel.value=saved;
}
if("speechSynthesis" in window){
 speechSynthesis.onvoiceschanged=refreshVoices;
 refreshVoices();
 setTimeout(refreshVoices,150);setTimeout(refreshVoices,600);setTimeout(refreshVoices,1500);
}
voiceSel.onchange=()=>localStorage.setItem(voiceStorageKey(),voiceSel.value);
function speak(t,rate=.82,onend=null){if(!t||!("speechSynthesis" in window)){if(onend)onend();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[langSel.value].code;u.rate=rate;const v=selectedVoice();if(v)u.voice=v;if(onend)u.onend=onend;setTimeout(()=>speechSynthesis.speak(u),40)}catch(e){if(onend)onend();}}
function showWord(key){lastWord=key;const x=LANGS[langSel.value].words[key]||[key,key];line.textContent=x[0];translation.textContent=langSel.value==="en"?"":x[1]}

 let scale=defaultScale(),fontScale=1,dragState=null;

     }

(()=>{

const codes={es:'es-ES',fr:'fr-FR',en:'en-US',de:'de-DE',it:'it-IT',pt:'pt-PT',no:'nb-NO',el:'el-GR'};
let currentSound=null, soundTimer=null;
function lang(){try{return document.querySelector('[id$="Language"]')?.value||localStorage.getItem('talkabee-learn-language')||'en'}catch(e){return 'en'}}
function translation(el,l){const en=el.dataset.tbEn||el.dataset.en||el.dataset.word||el.dataset.object||'';return l==='en'?en:(el.dataset['tb'+l.charAt(0).toUpperCase()+l.slice(1)]||en)}
function soundAfterVoice(el){
 clearTimeout(soundTimer);
 if(currentSound){try{currentSound.pause();currentSound.currentTime=0}catch(e){}currentSound=null}
 const path=(el.getAttribute('data-sound')||'').trim();if(!path)return;
 // The editor stores a path relative to the HTML page. Use that exact saved path.
 soundTimer=setTimeout(()=>{try{const audio=new Audio(path);currentSound=audio;audio.play().catch(e=>console.warn('Talk A Bee sound could not play:',path,e));audio.onended=()=>{if(currentSound===audio)currentSound=null}}catch(e){console.warn('Talk A Bee sound error:',path,e)}},1500);
}
document.addEventListener('click',function(ev){
 if(document.body.classList.contains('tb-hs-editing'))return;
 const el=ev.target.closest&&ev.target.closest('[data-tb-custom="1"]');if(!el)return;
 // Boardwalk's native hotspot handler already speaks, checks challenges, and
 // the shared data-sound listener plays assigned audio. Do not intercept it.
 if(typeof showWord==='function' && typeof speak==='function')return;

 const l=lang(),txt=translation(el,l),en=translation(el,'en'),key=el.dataset.word||el.dataset.object||en;
 try{if(typeof showWord==='function')showWord(key);else{const line=document.querySelector('[id$="Line"]');const trans=document.querySelector('[id$="Translation"]');if(line)line.textContent=txt;if(trans)trans.textContent=l==='en'?'':en}}catch(e){}

 soundAfterVoice(el);
},true);
