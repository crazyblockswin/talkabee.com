const boardwalkSounds={boardwalk:"carnival.mp3",ferris:"carnival.mp3",carousel:"circus.mp3",seagull:"seagull.mp3",bear:"dog-bark.mp3",icecream:"ice-cream.mp3",beach:"beach.mp3"};
let boardwalkSound=null;
function playBoardwalkSound(id){
  const file=boardwalkSounds[id];
  if(!file)return;
  if(boardwalkSound){boardwalkSound.pause();boardwalkSound.currentTime=0;}
  boardwalkSound=new Audio("sounds/"+file);
  boardwalkSound.play().catch(()=>{});
}

const challengeOrder=["ferris","carousel","lifeguard","kite","icecream","bear"];
const langSel=document.getElementById("lang"),voiceSel=document.getElementById("voice");
const title=document.getElementById("title"),prompt=document.getElementById("prompt"),line=document.getElementById("line"),translation=document.getElementById("translation"),status=document.getElementById("status"),world=document.getElementById("world");
let lastWord="ferris",challenge=-1;
function selectedVoice(){
 const vs=speechSynthesis.getVoices()||[];
 return vs.find(v=>v.voiceURI===voiceSel.value)||null;
}
function refreshVoices(){
 if(!("speechSynthesis" in window))return;
 const vs=speechSynthesis.getVoices()||[];
 if(!vs.length)return;
 const saved=localStorage.getItem("talkabee-boardwalk-voice")||voiceSel.value||"";
 voiceSel.innerHTML='<option value="">Browser Default</option>';
 vs.forEach(v=>voiceSel.add(new Option(v.name+" — "+(v.lang||""),v.voiceURI)));
 if([...voiceSel.options].some(o=>o.value===saved))voiceSel.value=saved;
}
if("speechSynthesis" in window){
 speechSynthesis.onvoiceschanged=refreshVoices;
 refreshVoices();
 setTimeout(refreshVoices,150);setTimeout(refreshVoices,600);setTimeout(refreshVoices,1500);
}
voiceSel.onchange=()=>localStorage.setItem("talkabee-boardwalk-voice",voiceSel.value);
function speak(t,rate=.82,onend=null){if(!t||!("speechSynthesis" in window)){if(onend)onend();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[langSel.value].code;u.rate=rate;const v=selectedVoice();if(v)u.voice=v;if(onend)u.onend=onend;setTimeout(()=>speechSynthesis.speak(u),40)}catch(e){if(onend)onend();}}
function showWord(key){lastWord=key;const x=LANGS[langSel.value].words[key];line.textContent=x[0];translation.textContent=langSel.value==="en"?"":x[1]}
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{activeLesson="";const key=b.dataset.word,x=LANGS[langSel.value].words[key];showWord(key);speak(x[0],.82,()=>playBoardwalkSound(key));if(challenge>=0){if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.color="#9dffbf"}else{status.textContent="Not that one — keep looking.";status.style.color="#ffe28a"}}});
document.getElementById("discovery").onclick=()=>{activeLesson="";challenge=-1;world.classList.remove("challenge-mode");title.textContent="Click & Discover";prompt.textContent="Click any object in the scene to hear its name.";status.textContent=""};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{activeLesson="";challenge=+b.dataset.ch;world.classList.add("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^\d+\.\s*/,"");status.textContent=""});

let activeLesson="";
function showLesson(key,speakIt=false){
  activeLesson=key;
  lastWord="";
  const a=lessons[langSel.value][key];
  const btn=document.querySelector(`[data-lesson="${key}"]`);
  title.textContent=btn?btn.textContent.replace(/^\d+\.\s*/,""):"Boardwalk Adventure";
  prompt.textContent=a[0];
  line.textContent=a[1];
  translation.textContent=langSel.value==="en"?"":lessons.en[key][1];
  if(speakIt)speak(a[1]);
}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{
  challenge=-1;
  world.classList.remove("challenge-mode");
  status.textContent="";
  showLesson(b.dataset.lesson,true);
});
function currentSpeechText(){
  if(activeLesson)return lessons[langSel.value][activeLesson][1];
  if(lastWord)return LANGS[langSel.value].words[lastWord][0];
  return line.textContent;
}
document.getElementById("normal").onclick=()=>speak(currentSpeechText(),.82);
document.getElementById("slow").onclick=()=>speak(currentSpeechText(),.58);
document.getElementById("replay").onclick=()=>speak(currentSpeechText(),.82);
langSel.onchange=()=>{
  if(activeLesson)showLesson(activeLesson,false);
  else if(lastWord)showWord(lastWord);
};

<script id="talkabee-literal-master-behavior">
(function(){
 function cleanActivityIcons(){
  document.querySelectorAll('.tab-master-panel button').forEach(function(b){
   if(b.matches('[data-lesson],[data-activity],[data-act],.activity,[data-train-activity],[data-home-activity]')){
    b.innerHTML=b.innerHTML.replace(/(^\s*\d+\.\s*)(?:<[^>]+>\s*)?[\u{1F000}-\u{1FAFF}\u2600-\u27BF]\uFE0F?\s*/u,'$1');
   }
  });
 }
 function moveHomeToBottom(){
  var p=document.querySelector('.tab-master-panel'); if(!p)return;
  var links=[].slice.call(p.querySelectorAll('a[href="index.html"],a[href$="/index.html"]'));
  links.forEach(function(a){p.appendChild(a)});
 }
 function labels(){
  document.querySelectorAll('.tab-master-card button').forEach(function(b){
   var t=b.textContent.trim();
   if(/normal/i.test(t)) b.textContent='🔊 Speak';
   if(/^next\s*(line|phrase)?/i.test(t)) b.textContent='Next phrase →';
  });
 }
 function run(){cleanActivityIcons();moveHomeToBottom();labels()}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
