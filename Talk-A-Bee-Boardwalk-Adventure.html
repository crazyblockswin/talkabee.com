<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk A Bee — Boardwalk Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#071526;color:#fff}
.world{position:relative;width:100vw;height:100vh;background:url("images/boardwalk-adventure.jpg") center center/cover no-repeat}
.panel{position:absolute;z-index:20;left:16px;top:16px;width:195px;max-height:calc(100vh - 32px);overflow:auto;padding:14px;border-radius:20px;background:rgba(7,23,39,.31);border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(3px)}
.panel h1{font-size:22px;margin:0 0 10px}.label{margin:11px 0 5px;font-size:12px;font-weight:900;letter-spacing:.12em;color:#e9f7ff}
.panel select,.panel button,.panel a{width:100%;display:block;margin:5px 0;padding:9px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.38);background:rgba(7,32,50,.54);color:#fff;font-weight:800;text-decoration:none;text-align:left}
.panel button:hover,.panel a:hover{background:rgba(255,255,255,.18)}
.card{position:absolute;z-index:19;right:2.2%;bottom:2.4%;width:min(470px,31vw);padding:16px 18px;border-radius:20px;background:rgba(7,23,39,.28);border:1px solid rgba(255,255,255,.32);box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(3px)}
.card h2{margin:0 0 5px;font-size:24px}.card p{margin:5px 0}.word{margin-top:10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.88);color:#10283c}.word strong{font-size:27px}.translation{font-size:17px;margin-top:3px}
.controls{display:flex;gap:8px;margin-top:10px}.controls button{flex:1;padding:9px;border:0;border-radius:11px;font-weight:900}
.hotspot{position:absolute;z-index:8;border:0;background:transparent;opacity:0;cursor:pointer;border-radius:16px}
.hotspot:hover,.hotspot:focus-visible{opacity:.22;background:rgba(255,220,72,.55);outline:2px solid rgba(255,255,255,.8)}
.challenge-mode .hotspot.target{opacity:1;background:rgba(255,199,48,.38);outline:4px solid #fff;box-shadow:0 0 0 7px rgba(255,200,50,.2)}
.talkabee-forward-arrow{position:fixed;z-index:10020;right:22px;top:18px;width:62px;height:62px;border:2px solid rgba(255,255,255,.82);border-radius:50%;background:rgba(11,22,42,.20);box-shadow:0 5px 16px rgba(0,0,0,.14);backdrop-filter:blur(2px);display:grid;place-items:center;text-decoration:none}
.talkabee-forward-arrow::before{content:"";width:17px;height:17px;border-top:5px solid #fff;border-right:5px solid #fff;transform:rotate(45deg) translate(-2px,2px);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.scene-view .panel,.scene-view .card{display:none}.scene-return{display:none;position:fixed;z-index:10030;left:18px;top:18px;padding:10px 14px;border-radius:12px;border:1px solid #fff;background:rgba(7,23,39,.65);color:#fff;font-weight:900}.scene-view .scene-return{display:block}
@media(max-width:900px){.panel{width:190px}.card{width:38vw}}
</style>

<style id="boardwalk-hotspots-hover-only">
.hotspot{display:block!important;opacity:0!important;background:transparent!important;outline:none!important;animation:none!important}
.hotspot:hover,.hotspot:focus-visible{opacity:1!important;background:rgba(255,220,72,.28)!important;outline:2px solid rgba(255,255,255,.85)!important}
.challenge-mode .hotspot.target{opacity:1!important;background:rgba(255,199,48,.38)!important;outline:4px solid #fff!important}
</style>

</head>
<body>

<script>
const LANGS={

de:{code:"de-DE",words:{ferris:["Riesenrad","Ferris wheel"],carousel:["Karussell","carousel"],tickets:["Fahrkartenschalter","ticket booth"],icecream:["Eis","ice cream"],popcorn:["Popcorn","popcorn"],lifeguard:["Rettungsschwimmerturm","lifeguard tower"],surfboard:["Surfbrett","surfboard"],umbrella:["Sonnenschirm","beach umbrella"],sandcastle:["Sandburg","sandcastle"],seagull:["Möwe","seagull"],kite:["Drachen","kite"],bicycle:["Fahrrad","bicycle"],skateboard:["Skateboard","skateboard"],trashcan:["Mülleimer","trash can"],binoculars:["Fernglas","binoculars"],sunglasses:["Sonnenbrille","sunglasses"],hat:["Hut","hat"],bench:["Bank","bench"],lamp:["Laterne","lamp"],flowers:["Blumen","flowers"],bear:["Bear","Bear"],ocean:["Ozean","ocean"]}},

};

const EXTRA_WORDS={
es:{palmtree:"palmera",flag:"bandera",icecreamcone:"cono de helado",rollercoaster:"montaña rusa",pier:"muelle",lifering:"salvavidas",beachchair:"silla de playa",bucket:"cubo",sailboat:"velero",boardwalk:"paseo marítimo",backpack:"mochila",boy:"niño",girl:"niña",grandpa:"abuelo",grandma:"abuela",beach:"playa"},
fr:{palmtree:"palmier",flag:"drapeau",icecreamcone:"cornet de glace",rollercoaster:"montagnes russes",pier:"jetée",lifering:"bouée de sauvetage",beachchair:"chaise de plage",bucket:"seau",sailboat:"voilier",boardwalk:"promenade",backpack:"sac à dos",boy:"garçon",girl:"fille",grandpa:"grand-père",grandma:"grand-mère",beach:"plage"},
en:{palmtree:"palm tree",flag:"flag",icecreamcone:"ice cream cone",rollercoaster:"roller coaster",pier:"pier",lifering:"life ring",beachchair:"beach chair",bucket:"bucket",sailboat:"sailboat",boardwalk:"boardwalk",backpack:"backpack",boy:"boy",girl:"girl",grandpa:"grandpa",grandma:"grandma",beach:"beach"},
de:{palmtree:"Palme",flag:"Flagge",icecreamcone:"Eistüte",rollercoaster:"Achterbahn",pier:"Seebrücke",lifering:"Rettungsring",beachchair:"Strandstuhl",bucket:"Eimer",sailboat:"Segelboot",boardwalk:"Promenade",backpack:"Rucksack",boy:"Junge",girl:"Mädchen",grandpa:"Opa",grandma:"Oma",beach:"Strand"},

};
Object.keys(EXTRA_WORDS).forEach(l=>{
  Object.entries(EXTRA_WORDS[l]).forEach(([k,v])=>{
    LANGS[l].words[k]=[v,l==="en"?"":EXTRA_WORDS.en[k]];
  });
});


const boardwalkSounds={boardwalk:"carnival.mp3",ferris:"carnival.mp3",carousel:"circus.mp3",seagull:"seagull.mp3",bear:"dog-bark.mp3",icecream:"ice-cream.mp3",beach:"beach.mp3"};
let boardwalkSound=null;
function playBoardwalkSound(id){
  const file=boardwalkSounds[id];
  if(!file)return;
  if(boardwalkSound){boardwalkSound.pause();boardwalkSound.currentTime=0;}
  boardwalkSound=new Audio("sounds/"+file);
  boardwalkSound.play().catch(()=>{});
}

const challengeOrder=["ferris","carousel","lifeguard","kite","icecream","bear"];
const langSel=document.getElementById("lang"),voiceSel=document.getElementById("voice");
const title=document.getElementById("title"),prompt=document.getElementById("prompt"),line=document.getElementById("line"),translation=document.getElementById("translation"),status=document.getElementById("status"),world=document.getElementById("world");
let lastWord="ferris",challenge=-1;
function fillVoices(){const vs=speechSynthesis.getVoices();voiceSel.innerHTML='<option>Browser Default</option>'+vs.map(v=>`<option>${v.name}</option>`).join("")}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices()}
function speak(t,rate=.82,onend=null){if(!t||!("speechSynthesis" in window)){if(onend)onend();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[langSel.value].code;u.rate=rate;const v=speechSynthesis.getVoices().find(v=>v.name===voiceSel.value);if(v)u.voice=v;if(onend)u.onend=onend;setTimeout(()=>speechSynthesis.speak(u),40)}catch(e){if(onend)onend();}}
function showWord(key){lastWord=key;const x=LANGS[langSel.value].words[key];line.textContent=x[0];translation.textContent=langSel.value==="en"?"":x[1]}
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{const key=b.dataset.word,x=LANGS[langSel.value].words[key];showWord(key);speak(x[0],.82,()=>playBoardwalkSound(key));if(challenge>=0){if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.color="#9dffbf"}else{status.textContent="Not that one — keep looking.";status.style.color="#ffe28a"}}});
document.getElementById("discovery").onclick=()=>{challenge=-1;world.classList.remove("challenge-mode");title.textContent="Click & Discover";prompt.textContent="Click any object in the scene to hear its name.";status.textContent=""};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{challenge=+b.dataset.ch;world.classList.add("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^\d+\.\s*/,"");status.textContent=""});
const lessons={arrive:["We are at the boardwalk.","Look at the rides and the ocean."],rides:["Which ride would you like?","I would like the Ferris wheel."],snacks:["Would you like ice cream or popcorn?","I would like ice cream, please."],beach:["Let’s walk to the beach.","Bring the umbrella and surfboard."],safety:["Where is the lifeguard?","The lifeguard tower is by the ocean."],things:["What do you see?","I see a bicycle, a kite, and a seagull."]};
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{challenge=-1;world.classList.remove("challenge-mode");const a=lessons[b.dataset.lesson];title.textContent=b.textContent.replace(/^\d+\.\s*/,"");prompt.textContent=a[0];line.textContent=a[1];translation.textContent="";lastWord="";speak(a[1])});
document.getElementById("normal").onclick=()=>speak(lastWord?LANGS[langSel.value].words[lastWord][0]:line.textContent,.82);
document.getElementById("slow").onclick=()=>speak(lastWord?LANGS[langSel.value].words[lastWord][0]:line.textContent,.58);
document.getElementById("replay").onclick=()=>speak(lastWord?LANGS[langSel.value].words[lastWord][0]:line.textContent,.82);
langSel.onchange=()=>{if(lastWord)showWord(lastWord)};
document.getElementById("sceneView").onclick=()=>document.body.classList.add("scene-view");
document.getElementById("sceneReturn").onclick=()=>document.body.classList.remove("scene-view");
showWord("ferris");
</script>
