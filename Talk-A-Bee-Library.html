nd Daniel sind in der Bibliothek.", ["Sofia: Wir sind in der Bibliothek.", "Daniel: Ich suche ein Italienischbuch.", "Sofia: Hier ist eins."]], "books": ["Bücher & Lesen", "Sprich über Bücher und Lesen.", ["Dieses Buch ist interessant.", "Ich lese gern.", "Wo ist das Buch?"]], "study": ["Gemeinsam lernen", "Nützliche Wörter beim Lernen.", ["Ich habe ein Notizbuch.", "Ich brauche einen Stift.", "Wir lernen zusammen."]], "travel": ["Italien & Reisen", "Die Bibliothek kann dich an viele Orte bringen.", ["Ich möchte nach Italien reisen.", "Rom ist eine schöne Stadt.", "Ich brauche einen Reiseführer."]], "phrases": ["Nützliche Sätze", "Übe einfache Sätze.", ["Guten Morgen.", "Wo befindet sich ...?", "Ein Buch, bitte."]], "questions": ["Fragen stellen", "Übe Fragen, die du überall verwenden kannst.", ["Was bedeutet das?", "Wie sagt man das auf Deutsch?", "Können Sie das bitte wiederholen?"]]}, "it": {"conversation": ["In biblioteca", "Sofia e Daniel sono in biblioteca.", ["Sofia: Siamo in biblioteca.", "Daniel: Cerco un libro d’italiano.", "Sofia: Eccone uno."]], "books": ["Libri e lettura", "Parla di libri e lettura.", ["Questo libro è interessante.", "Mi piace leggere.", "Dov’è il libro?"]], "study": ["Studiare insieme", "Parole utili mentre si studia.", ["Ho un quaderno.", "Ho bisogno di una penna.", "Studiamo insieme."]], "travel": ["Italia e viaggi", "La biblioteca può portarti in tanti luoghi.", ["Voglio viaggiare in Italia.", "Roma è una bella città.", "Ho bisogno di una guida turistica."]], "phrases": ["Frasi utili", "Esercitati con frasi semplici.", ["Buongiorno.", "Dove si trova...?", "Un libro, per favore."]], "questions": ["Fare domande", "Esercitati con domande utili ovunque.", ["Che cosa significa?", "Come si dice in italiano?", "Può ripetere, per favore?"]]}, "pt": {"conversation": ["Na biblioteca", "Sofia e Daniel estão na biblioteca.", ["Sofia: Estamos na biblioteca.", "Daniel: Estou procurando um livro de italiano.", "Sofia: Aqui está um."]], "books": ["Livros e leitura", "Fale sobre livros e leitura.", ["Este livro é interessante.", "Gosto de ler.", "Onde está o livro?"]], "study": ["Estudando juntos", "Palavras úteis durante o estudo.", ["Tenho um caderno.", "Preciso de uma caneta.", "Estudamos juntos."]], "travel": ["Itália e viagens", "A biblioteca pode levar você a muitos lugares.", ["Quero viajar para a Itália.", "Roma é uma cidade bonita.", "Preciso de um guia de viagem."]], "phrases": ["Frases úteis", "Pratique frases simples.", ["Bom dia.", "Onde fica...?", "Um livro, por favor."]], "questions": ["Fazer perguntas", "Pratique perguntas que você pode usar em qualquer lugar.", ["O que isso significa?", "Como se diz isso em português?", "Pode repetir, por favor?"]]}, "no": {"conversation": ["På biblioteket", "Sofia og Daniel er på biblioteket.", ["Sofia: Vi er på biblioteket.", "Daniel: Jeg leter etter en italienskbok.", "Sofia: Her er en."]], "books": ["Bøker og lesing", "Snakk om bøker og lesing.", ["Denne boken er interessant.", "Jeg liker å lese.", "Hvor er boken?"]], "study": ["Studere sammen", "Nyttige ord mens dere studerer.", ["Jeg har en notatbok.", "Jeg trenger en penn.", "Vi studerer sammen."]], "travel": ["Italia og reise", "Biblioteket kan ta deg til mange steder.", ["Jeg vil reise til Italia.", "Roma er en vakker by.", "Jeg trenger en reiseguide."]], "phrases": ["Nyttige uttrykk", "Øv på enkle uttrykk.", ["God morgen.", "Hvor er ...?", "En bok, takk."]], "questions": ["Stille spørsmål", "Øv på spørsmål du kan bruke hvor som helst.", ["Hva betyr dette?", "Hvordan sier man dette på norsk?", "Kan du gjenta, takk?"]]}, "en": {"conversation": ["At the Library", "Sofia and Daniel are at the library.", ["Sofia: We are in the library.", "Daniel: I am looking for an Italian book.", "Sofia: Here is one."]], "books": ["Books & Reading", "Talk about books and reading.", ["This book is interesting.", "I like to read.", "Where is the book?"]], "study": ["Studying Together", "Useful words while studying.", ["I const WORDS={"es": [["libro", "book"], ["fuente", "fountain"], ["taza", "cup"], ["cuaderno", "notebook"], ["bolígrafo", "pen"], ["escalera", "ladder"]], "fr": [["livre", "book"], ["fontaine", "fountain"], ["tasse", "cup"], ["cahier", "notebook"], ["stylo", "pen"], ["échelle", "ladder"]], "en": [["book", "book"], ["fountain", "fountain"], ["cup", "cup"], ["notebook", "notebook"], ["pen", "pen"], ["ladder", "ladder"]], "de": [["Buch", "book"], ["Brunnen", "fountain"], ["Tasse", "cup"], ["Notizbuch", "notebook"], ["Stift", "pen"], ["Leiter", "ladder"]], "it": [["libro", "book"], ["fontana", "fountain"], ["tazza", "cup"], ["quaderno", "notebook"], ["penna", "pen"], ["scala", "ladder"]], "pt": [["livro", "book"], ["fonte", "fountain"], ["xícara", "cup"], ["caderno", "notebook"], ["caneta", "pen"], ["escada", "ladder"]], "no": [["bok", "book"], ["fontene", "fountain"], ["kopp", "cup"], ["notatbok", "notebook"], ["penn", "pen"], ["stige", "ladder"]]};
const world=document.getElementById('world'),lines=document.getElementById('lines'),title=document.getElementById('title'),prompt=document.getElementById('prompt'),kicker=document.getElementById('kicker'),tip=document.getElementById('tip'),pop=document.getElementById('pop'),language=document.getElementById('language'),voice=document.getElementById('voice');
let mode='lesson',active='conversation',challenge=-1,lastSpeech='';
language.value=localStorage.getItem('talkabee-learn-language')||'es';
function lang(){return language.value}
function fillVoices(){let base=LANGS[lang()].code.split('-')[0].toLowerCase(),saved=localStorage.getItem('talkabee-library-voice-'+lang())||'',vs=(speechSynthesis.getVoices()||[]).filter(v=>(v.lang||'').toLowerCase().startsWith(base));voice.innerHTML='<option value="">Browser Default</option>';vs.forEach(v=>voice.add(new Option(v.name+' — '+v.lang,v.name)));if([...voice.options].some(o=>o.value===saved))voice.value=saved}
function speak(t,slow=false){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=LANGS[lang()].code;u.rate=slow?.62:.88;let v=speechSynthesis.getVoices().find(x=>x.name===voice.value);if(v)u.voice=v;lastSpeech=t;speechSynthesis.speak(u)}
function clearActive(){document.querySelectorAll('.dir button').forEach(b=>b.classList.remove('active'))}
function load(k){mode='lesson';active=k;challenge=-1;world.className='world';clearActive();let d=LESSONS[lang()][k],e=LESSONS.en[k];kicker.textContent=d[0].toUpperCase();title.textContent=d[1];prompt.textContent='Click a line to hear the selected language.';lines.innerHTML='';d[2].forEach((a,i)=>{let q=document.createElement('div');q.className='line';let en=e[2][i];q.innerHTML='<b>'+a+'</b>'+(lang()==='en'?'':'<br>'+en);q.onclick=()=>speak(a);lines.appendChild(q)});tip.textContent='Choose another activity, Discovery, or a Challenge.';let b=document.querySelector('[data-lesson="'+k+'"]');if(b)b.classList.add('active')}
function loadDiscovery(){mode='discovery';challenge=-1;world.className='world discovery';clearActive();document.getElementById('discovery').classList.add('active');kicker.textContent='DISCOVERY';title.textContent='Explore the Library';prompt.textContent='Click highlighted objects to see the selected-language word and its English meaning.';lines.innerHTML='';tip.textContent='Try all six objects in the scene.'}
const hs=[...document.querySelectorAll('.hotspots button')];
hs.forEach((h,i)=>h.onclick=e=>{let pair=WORDS[lang()][i],w=pair[0],en=pair[1];pop.textContent=lang()==='en'?w:w+' — '+en;pop.style.left=Math.min(e.clientX+12,innerWidth-180)+'px';pop.style.top=Math.max(10,e.clientY-40)+'px';pop.style.display='block';speak(w);setTimeout(()=>pop.style.display='none',1800);if(mode==='challenge'){if(i===challenge)tip.textContent='✅ Correct! You found '+en+'.';else tip.textContent='Try again — look carefully.'}});
function loadChallenge(n){mode='challenge';challenge=n;world.className='world challenge';clearActive();let pair=WORDS[lang()][n];kicker.textContent='CHALLENGE '+(n+1)+' OF 6';title.textContent='Find: '+pair[0];prompt.textContent='Click the correct object in the library scene.';lines.innerHTML='';tip.textContent='Find it to complete this challenge.';let b=document.querySelector('[data-ch="'+n+'"]');if(b)b.classList.add('active')}
document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>load(b.dataset.lesson));

document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>loadChallenge(+b.dataset.ch));
document.getElementById('sceneView').onclick=()=>world.classList.add('scene-only');
document.getElementById('restore').onclick=()=>{world.classList.remove('scene-only');if(mode==='discovery')world.classList.add('discovery');if(mode==='challenge')world.classList.add('challenge')};
language.onchange=()=>{localStorage.setItem('talkabee-learn-language',lang());fillVoices();if(mode==='lesson')load(active);else if(mode==='discovery')loadDiscovery();else loadChallenge(challenge)};
voice.onchange=()=>localStorage.setItem('talkabee-library-voice-'+lang(),voice.value);
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices()}
load('conversation');
</script></body></html>
