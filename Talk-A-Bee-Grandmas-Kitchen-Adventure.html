const kitchenSceneSounds={
 clock:'sounds/clock.mp3',
 stove:'sounds/stove.mp3',
 pans:'sounds/pan.mp3',
 girl:'sounds/child-laughing.mp3',
 grandma:'sounds/cathy-kitchen.mp3',
 bear:'sounds/dog-panting.wav'
};
let kitchenSceneAudio=null;
function playKitchenSceneSound(key){
 const url=kitchenSceneSounds[key];
 if(!url)return;
 if(kitchenSceneAudio){kitchenSceneAudio.pause();kitchenSceneAudio.currentTime=0}
 kitchenSceneAudio=new Audio(url);
 kitchenSceneAudio.volume=.82;
 kitchenSceneAudio.play().catch(()=>{});
}
const challengeKeys=["flour", "bowl", "rollingpin", "stove", "refrigerator", "bee"];
const activityTitles=["\ud83c\udf6a Baking Cookies", "\ud83e\udd63 Finding Ingredients", "\ud83e\udd44 Kitchen Actions", "\ud83d\udc75 Helping Grandma", "\u2b50 Colors & Counting", "\ud83e\udd67 Sharing the Treats"];
const world=document.getElementById('world'),langSel=document.getElementById('language'),voiceSel=document.getElementById('voice');
const lineEl=document.getElementById('line'),transEl=document.getElementById('translation'),pop=document.getElementById('pop');
let activity=0,phrase=0,mode='activity',challenge=0,lastText='';
const saved=localStorage.getItem('talkabee-learn-language');if(saved&&languageData[saved])langSel.value=saved;
function L(){return languageData[langSel.value]}
function voices(){let all=speechSynthesis.getVoices(),prefix=L().speech.slice(0,2).toLowerCase();return all.filter(v=>v.lang.toLowerCase().startsWith(prefix))}
function fillVoices(){let old=localStorage.getItem('talkabee-kitchen-voice-'+langSel.value)||'';voiceSel.innerHTML='<option value="">Browser Default</option>';voices().forEach(v=>{let o=document.createElement('option');o.value=v.name;o.textContent=v.name;voiceSel.appendChild(o)});if([...voiceSel.options].some(o=>o.value===old))voiceSel.value=old}
speechSynthesis.onvoiceschanged=fillVoices;fillVoices();
function speak(text,rate=.88){if(!text)return;speechSynthesis.cancel();setTimeout(()=>{let u=new SpeechSynthesisUtterance(text);u.lang=L().speech;u.rate=rate;let v=speechSynthesis.getVoices().find(x=>x.name===voiceSel.value);if(v)u.voice=v;speechSynthesis.speak(u)},50);lastText=text}
function render(){mode='activity';world.classList.remove('discovery','challenge-mode');pop.classList.remove('show');document.getElementById('title').textContent=activityTitles[activity];document.getElementById('prompt').textContent='Listen, then practice each useful kitchen sentence.';lineEl.textContent=L().activities[activity][phrase];transEl.textContent=L().english[activity][phrase];document.querySelectorAll('.activity').forEach((b,i)=>b.classList.toggle('active',i===activity));}
document.querySelectorAll('.activity').forEach(b=>b.onclick=()=>{activity=+b.dataset.activity;phrase=0;render()});
document.getElementById('next').onclick=()=>{if(mode==='activity'){phrase=(phrase+1)%4;render()}else if(mode==='challenge'){challenge=(challenge+1)%6;startChallenge(challenge)}};
document.getElementById('speak').onclick=()=>speak(lastText||lineEl.textContent,.88);document.getElementById('slow').onclick=()=>speak(lastText||lineEl.textContent,.62);document.getElementById('replay').onclick=()=>speak(lastText||lineEl.textContent,.88);
document.getElementById('discover').onclick=()=>{mode='discovery';world.classList.add('discovery');world.classList.remove('challenge-mode');document.getElementById('title').textContent='Click an object in the picture.';document.getElementById('prompt').textContent='See the learning-language word and its English meaning. Audio speaks only the learning-language word.';lineEl.textContent='Tap a hotspot in the scene.';transEl.textContent='';pop.classList.remove('show')};
function startChallenge(i){mode='challenge';challenge=i;world.classList.add('challenge-mode');world.classList.remove('discovery');let k=challengeKeys[i],o=objects[langSel.value][k];document.getElementById('title').textContent='Challenge '+(i+1)+' of 6';document.getElementById('prompt').textContent='Find: '+o[0];lineEl.textContent='Click the correct object.';transEl.textContent='';pop.classList.remove('show')}
document.querySelectorAll('.challenge').forEach(b=>b.onclick=()=>startChallenge(+b.dataset.challenge));
document.querySelectorAll('.hotspot').forEach(b=>b.onclick=()=>{let k=b.dataset.object;playKitchenSceneSound(k);let o=objects[langSel.value][k];if(mode==='discovery'){pop.textContent=o[0]+' — '+o[1];pop.classList.add('show');speak(o[0],.76)}else if(mode==='challenge'){let right=k===challengeKeys[challenge];pop.textContent=right?'✓ Correct! '+o[0]:'Try again.';pop.classList.add('show');if(right)speak(o[0],.76)}});
langSel.onchange=()=>{localStorage.setItem('talkabee-learn-language',langSel.value);fillVoices();if(mode==='activity')render();else if(mode==='challenge')startChallenge(challenge)};
voiceSel.onchange=()=>localStorage.setItem('talkabee-kitchen-voice-'+langSel.value,voiceSel.value);
document.getElementById('sceneView').onclick=()=>world.classList.add('scene-only');document.getElementById('restore').onclick=()=>world.classList.remove('scene-only');
document.getElementById('mainDir').onclick=()=>location.href='index.html';
render();
