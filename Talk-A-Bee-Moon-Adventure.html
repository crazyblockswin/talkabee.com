en:{crew:["The Moon crew is exploring the lunar surface in spacesuits while Bee joins the expedition.","Astronauts need life-support equipment because the Moon has essentially no breathable atmosphere."],surface:["The Moon's surface is covered by broken rock and fine material called regolith, with craters and rugged terrain.","With much weaker gravity than Earth, astronauts would weigh less on the Moon."],lander:["A lunar lander is designed to carry astronauts or equipment between lunar orbit and the Moon's surface.","Landing safely requires careful navigation because the surface contains rocks, slopes, and craters."],rover:["A lunar rover helps astronauts travel farther across the Moon and carry equipment.","Rovers can also support scientific exploration by moving tools, samples, and instruments."],base:["Future lunar habitats could give crews protected places to live and work during longer missions.","A Moon base would need systems for power, communication, temperature control, air, water, and other supplies."],earth:["From the Moon, Earth appears as a bright world hanging in the dark sky.","Earth is about 384,400 kilometers, or roughly 239,000 miles, from the Moon on average."]},

de:{crew:["Die Mondbesatzung erkundet die Oberfläche in Raumanzügen, während die Biene an der Expedition teilnimmt.","Astronauten brauchen Lebenserhaltungssysteme, weil der Mond praktisch keine atembare Atmosphäre besitzt."],surface:["Die Mondoberfläche ist mit zerbrochenem Gestein und feinem Material namens Regolith bedeckt und weist Krater sowie unebenes Gelände auf.","Wegen der viel schwächeren Schwerkraft würden Astronauten auf dem Mond weniger wiegen als auf der Erde."],lander:["Eine Mondlandefähre transportiert Astronauten oder Ausrüstung zwischen der Mondumlaufbahn und der Oberfläche.","Eine sichere Landung erfordert sorgfältige Navigation wegen Felsen, Hängen und Kratern."],rover:["Ein Mondrover hilft Astronauten, größere Entfernungen zurückzulegen und Ausrüstung zu transportieren.","Rover können die wissenschaftliche Erforschung unterstützen, indem sie Werkzeuge, Proben und Instrumente bewegen."],base:["Zukünftige Mondhabitate könnten Besatzungen geschützte Orte zum Leben und Arbeiten während längerer Missionen bieten.","Eine Mondbasis bräuchte Systeme für Energie, Kommunikation, Temperaturkontrolle, Luft, Wasser und weitere Vorräte."],earth:["Vom Mond aus erscheint die Erde als helle Welt am dunklen Himmel.","Die Erde ist im Durchschnitt etwa 384.400 Kilometer vom Mond entfernt."]},

function showWord(key){activeLesson="";lastWord=key;lessonPhrase=1;if(challenge<0){title.textContent="Click & Discover";prompt.textContent="You found "+(EN[key]||key)+".";}line.textContent=WORDS[langSel.value][key]||EN[key]||key;translation.textContent=langSel.value==="en"?"":(EN[key]||key)}
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{const key=b.dataset.word;showWord(key);let played=false;const after=()=>{if(played)return;played=true;playSound(key)};speak(WORDS[langSel.value][key]||EN[key]||key,.82,after);setTimeout(after,1500);if(challenge>=0){if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.setProperty("color","#35e46a","important")}else{status.textContent="Not that one — keep looking.";status.style.setProperty("color","#ffe28a","important")}}});
function clearChallenge(){challenge=-1;world.classList.remove("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.remove("target"));status.textContent=""}
document.getElementById("discovery").onclick=()=>{clearChallenge();activeLesson="";lastWord="game";title.textContent="Click & Discover";prompt.textContent="Click any object in the scene to hear its name.";line.textContent=WORDS[langSel.value].game;translation.textContent=langSel.value==="en"?"":EN.game};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{activeLesson="";lastWord="";challenge=+b.dataset.ch;world.classList.add("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^[0-9]+\.\s*/,"");line.textContent=WORDS[langSel.value][challengeOrder[challenge]];translation.textContent=langSel.value==="en"?"":EN[challengeOrder[challenge]];status.textContent=""});
function showLesson(key,speakIt=false){clearChallenge();activeLesson=key;lastWord="";lessonPhrase=Math.max(0,Math.min(1,lessonPhrase));const a=lessons[langSel.value][key],e=lessons.en[key],btn=document.querySelector(`[data-lesson="${key}"]`);title.textContent=btn?btn.textContent.replace(/^[0-9]+\.\s*/,""):"Moon Adventure";prompt.textContent=a[0];line.textContent=a[lessonPhrase];translation.textContent=langSel.value==="en"?"":e[lessonPhrase];if(speakIt)speak(a[lessonPhrase])}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{lessonPhrase=1;showLesson(b.dataset.lesson,true)});
function currentSpeechText(){if(activeLesson)return lessons[langSel.value][activeLesson][lessonPhrase];if(lastWord)return WORDS[langSel.value][lastWord]||EN[lastWord]||lastWord;return line.textContent}
document.getElementById("normal").onclick=()=>speak(currentSpeechText(),.82);
document.getElementById("slow").onclick=()=>speak(currentSpeechText(),.58);
document.getElementById("replay").onclick=()=>speak(lastSpoken||currentSpeechText(),.82);
document.getElementById("nextPhrase").onclick=()=>{if(!activeLesson){const keys=Object.keys(EN),i=Math.max(0,keys.indexOf(lastWord));showWord(keys[(i+1)%keys.length]);speak(currentSpeechText(),.82);return}lessonPhrase=(lessonPhrase+1)%2;showLesson(activeLesson,true)};
langSel.onchange=()=>{fillVoices();if(activeLesson)showLesson(activeLesson,false);else if(lastWord)showWord(lastWord)};
document.getElementById("sceneView").onclick=()=>document.body.classList.add("scene-view");
document.getElementById("sceneReturn").onclick=()=>document.body.classList.remove("scene-view");
showWord("game");
</script>

<script id="talkabee-language-sync-repair-20261009">
(function(){
  const KEY='talkabee-learn-language';
  const language=document.getElementById('lang');
  if(!language)return;
  function restore(){
    let saved;
    try{saved=localStorage.getItem(KEY)}catch(e){return}
    if(saved && [...language.options].some(o=>o.value===saved) && language.value!==saved){
      language.value=saved;
      language.dispatchEvent(new Event('change',{bubbles:true}));
    }
  }
  language.addEventListener('change',function(){
    try{localStorage.setItem(KEY,language.value)}catch(e){}
  },true);
  restore();
  window.addEventListener('pageshow',restore);
  window.addEventListener('storage',function(e){if(e.key===KEY)restore()});
})();
</script>

<script id="talkabee-approved-card-learning-text">
/* Approved learning text sizes without changing A+/A- behavior.
   The existing font controls use data-base-font, so update those baselines too. */
(function(){
  function enlarge(){
    const card=document.querySelector('.tab-master-card');
    if(!card)return;
    const sizes={'.kicker':19,'#title':28,'#prompt':24,'#line':28,'#translation':24};
    const factor=parseFloat(getComputedStyle(card).getPropertyValue('--tab-card-font-scale'))||1;
    for(const [selector,base] of Object.entries(sizes)){
      const el=card.querySelector(selector);
      if(!el)return;
      el.dataset.baseFont=base+'px';
      el.style.setProperty('font-size',(base*factor)+'px','important');
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enlarge);
  else enlarge();
})();
</script>
