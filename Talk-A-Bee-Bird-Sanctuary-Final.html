<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk A Bee — Bird Sanctuary</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:#172335;color:#172335}
button{font:inherit;cursor:pointer}
#birdWorld{position:fixed;inset:0;overflow:hidden;background:#172335}
.scene{position:absolute;inset:0;overflow:hidden;transform:scale(.90);transform-origin:center center;width:111.111%;height:111.111%;left:-5.555%;top:-5.555%}
.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}

.directory{position:absolute;z-index:30;left:12px;top:12px;bottom:12px;width:188px;padding:10px;overflow-y:auto;scrollbar-width:none;border:1px solid rgba(255,255,255,.2);border-radius:17px;background:rgba(12,28,38,.46);backdrop-filter:blur(7px);box-shadow:0 14px 35px rgba(0,0,0,.22);color:#fff}
.directory::-webkit-scrollbar{display:none}
.place{font-size:15px;font-weight:950;line-height:1.1;margin:2px 2px 9px}
.label{margin:10px 3px 4px;font-size:9px;font-weight:950;letter-spacing:.14em;color:rgba(255,255,255,.75)}
.directory button{display:block;width:100%;margin:3px 0;padding:7px 8px;border:0;border-radius:10px;background:rgba(255,255,255,.09);color:#fff;text-align:left;font-size:11px;font-weight:850}
.directory button:hover,.directory button.active{background:rgba(67,133,94,.82)}
.back{display:block;width:100%;margin:0 0 8px!important;background:rgba(255,255,255,.16)!important;text-align:center!important}

.panel{position:absolute;z-index:28;right:2.2%;bottom:3%;width:32%;max-width:570px;max-height:40%;overflow:auto;scrollbar-width:none;padding:12px 14px;border:1px solid rgba(255,255,255,.35);border-radius:20px;background:rgba(255,252,242,.43);backdrop-filter:blur(3px);box-shadow:0 12px 30px rgba(20,30,40,.16)}
.panel::-webkit-scrollbar{display:none}
.kicker{font-size:10px;font-weight:950;letter-spacing:.13em;color:#315f45}
.panel h2{margin:3px 0;font-size:clamp(18px,1.5vw,27px)}
.panel p{font-size:12px;margin:5px 0 7px}
.line{padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.68);font-size:16px;font-weight:900}
.translation{font-size:12px;margin:5px 0 7px}
.actions{display:flex;gap:6px;margin-top:7px}
.actions button,.challengeNext{border:0;border-radius:10px;padding:8px 10px;background:rgba(48,105,72,.92);color:#fff;font-size:11px;font-weight:900}
.find{display:none;margin-top:8px;padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.64);font-size:11px}
.find.show{display:block}
.count{font-size:9px;font-weight:950;letter-spacing:.12em;color:#315f45;margin-bottom:5px}
.status{min-height:20px;margin:5px 0;font-weight:900}
.hint{font-size:10px;color:#596174;margin:4px 0 7px}

.hotspots{position:absolute;inset:0;z-index:22;pointer-events:none}
.hotspot{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;opacity:.025;pointer-events:auto}
.hotspot:hover,.hotspot:focus-visible{opacity:.52;outline:4px solid rgba(255,255,255,.95);outline-offset:-4px;background:rgba(70,145,90,.32)}

/* Hotspots positioned to the Bird Sanctuary artwork */
[data-word="ryder"]{left:25%;top:49%;width:15%;height:34%}
[data-word="grandpa"]{left:46%;top:40%;width:18%;height:43%}
[data-word="daniel"]{left:75%;top:51%;width:18%;height:34%}

[data-word="birdhouse"]{left:55%;top:62%;width:17%;height:27%}
[data-word="birdhouse2"]{left:77%;top:70%;width:14%;height:23%}
[data-word="birdfeeder"]{left:79%;top:12%;width:10%;height:22%}
[data-word="cardinal"]{left:4%;top:7%;width:9%;height:14%}
[data-word="woodpecker"]{left:95%;top:10%;width:8%;height:18%}
[data-word="bluebird"]{left:91%;top:51%;width:11%;height:15%}
[data-word="butterfly"]{left:66%;top:36%;width:8%;height:12%}
[data-word="rv"]{left:47%;top:20%;width:31%;height:25%}
[data-word="solarpanel"]{left:44%;top:9%;width:15%;height:9%}
[data-word="lake"]{left:82%;top:31%;width:27%;height:20%}
[data-word="waterfall"]{left:82%;top:59%;width:13%;height:19%}
[data-word="mountain"]{left:72%;top:17%;width:22%;height:17%}
[data-word="flowers"]{left:14%;top:27%;width:24%;height:18%}
[data-word="tools"]{left:7%;top:53%;width:13%;height:30%}
[data-word="tree"]{left:94%;top:24%;width:14%;height:47%}

@media(max-width:850px){
 .directory{width:165px}
 .panel{right:2%;width:39%}
}
</style>

<style id="bird-modern-controls">
.directory select{width:100%;margin:3px 0;padding:7px 8px;border:0;border-radius:10px;color:#24324a;font-size:11px;font-weight:800}
.sceneView{background:rgba(255,255,255,.16)!important;text-align:center!important}
.restorePanel{display:none;position:absolute;z-index:60;left:12px;top:12px;border:0;border-radius:11px;padding:9px 12px;font-weight:900}
#birdWorld.scene-only .directory,#birdWorld.scene-only .panel{display:none!important}
#birdWorld.scene-only .restorePanel{display:block!important}
</style>

</head>
<body>
<section id="birdWorld">
 <button class="restorePanel" id="restorePanel" type="button">← Return Panel</button>
 <div class="scene">
  <img src="images/bird-sanctuary.jpg" alt="Ryder and Daniel building birdhouses with Grandpa at the Bird Sanctuary">

  <aside class="directory">
   <button class="back" type="button" onclick="window.location.href='index.html'">← Main Directory</button>

  <div class="hotspots">

   <button class="hotspot" data-word="hammer" aria-label="Hammer"></button>
   <button class="hotspot" data-word="paintbrush" aria-label="Paintbrush"></button>
   <button class="hotspot" data-word="paint" aria-label="Paint"></button>
   <button class="hotspot" data-word="birdhouse" aria-label="Birdhouse"></button>
   <button class="hotspot" data-word="birdhouse2" aria-label="Birdhouse"></button>

   <button class="hotspot" data-word="butterfly" aria-label="Butterfly"></button>
   <button class="hotspot" data-word="rv" aria-label="RV"></button>
   <button class="hotspot" data-word="solarpanel" aria-label="Solar panel"></button>
   <button class="hotspot" data-word="lake" aria-label="Lake"></button>
   <button class="hotspot" data-word="waterfall" aria-label="Waterfall"></button>

 </div>
</section>

<script>
(()=>{
const lessons={
 meet:{title:"Ryder & Daniel",prompt:"Meet the boys and talk about what they are doing.",lines:[
  ["Ryder está pintando una casita para pájaros.","Ryder is painting a birdhouse."],
  ["Daniel está mirando los pájaros.","Daniel is watching the birds."],
  ["El abuelo ayuda a Ryder y Daniel.","Grandpa helps Ryder and Daniel."],
  ["Los niños están aprendiendo juntos.","The boys are learning together."]]},
 build:{title:"Build a Birdhouse",prompt:"Practice sentences about building a home for the birds.",lines:[
  ["Estamos construyendo una casita para pájaros.","We are building a birdhouse."],
  ["El abuelo usa el martillo.","Grandpa uses the hammer."],
  ["Ryder pinta el techo de rojo.","Ryder paints the roof red."],
  ["Daniel sostiene la casita para pájaros.","Daniel holds the birdhouse."]]},
 birds:{title:"Bird Words",prompt:"Look around the sanctuary and practice bird names.",lines:[
  ["El cardenal es rojo.","The cardinal is red."],
  ["El pájaro azul está cerca de las flores.","The bluebird is near the flowers."],
  ["El pájaro carpintero está en el árbol.","The woodpecker is on the tree."],
  ["Los pájaros comen en el comedero.","The birds eat at the feeder."]]},
 tools:{title:"Tools & Colors",prompt:"Practice useful tool and color words from the workbench.",lines:[
  ["El martillo está en la mano del abuelo.","The hammer is in Grandpa's hand."],
  ["Ryder tiene un pincel.","Ryder has a paintbrush."],
  ["La pintura roja está sobre la mesa.","The red paint is on the table."],
  ["La casita tiene un techo verde.","The birdhouse has a green roof."]]},
 nature:{title:"Nature Around Us",prompt:"Describe the beautiful things around the Bird Sanctuary.",lines:[
  ["Las montañas están detrás del lago.","The mountains are behind the lake."],
  ["Hay muchas flores de colores.","There are many colorful flowers."],
  ["Una mariposa vuela cerca de los niños.","A butterfly flies near the boys."],
  ["El agua cae por la cascada.","The water falls down the waterfall."]]},
 sanctuary:{title:"Sanctuary Adventure",prompt:"Put the people, birds, tools, and nature together.",lines:[
  ["Ryder y Daniel pasan el día en el santuario de aves.","Ryder and Daniel spend the day at the bird sanctuary."],
  ["Construyen casas para los pájaros con su abuelo.","They build birdhouses with their grandpa."],
  ["Los pájaros vuelan entre los árboles y las flores.","The birds fly among the trees and flowers."],
  ["Todos disfrutan de un hermoso día junto al lago.","Everyone enjoys a beautiful day by the lake."]]}
};

const originalWords={
 ryder:["Ryder.","Ryder."],
 grandpa:["El abuelo.","Grandpa."],
 daniel:["Daniel.","Daniel."],
 hammer:["El martillo.","The hammer."],
 paintbrush:["El pincel.","The paintbrush."],
 paint:["La pintura.","The paint."],
 birdhouse:["La casita para pájaros.","The birdhouse."],
 birdhouse2:["La casita para pájaros.","The birdhouse."],
 birdfeeder:["El comedero para pájaros.","The bird feeder."],
 cardinal:["El cardenal.","The cardinal."],
 woodpecker:["El pájaro carpintero.","The woodpecker."],
 bluebird:["El pájaro azul.","The bluebird."],
 butterfly:["La mariposa.","The butterfly."],
 rv:["La casa rodante.","The RV."],
 solarpanel:["El panel solar.","The solar panel."],
 lake:["El lago.","The lake."],
 waterfall:["La cascada.","The waterfall."],
 mountain:["La montaña.","The mountain."],
 flowers:["Las flores.","The flowers."],
 tools:["Las herramientas.","The tools."],
 tree:["El árbol.","The tree."]
};


const LANGS={"es": {"code": "es-ES"}, "fr": {"code": "fr-FR"}, "en": {"code": "en-US"}, "de": {"code": "de-DE"}, "it": {"code": "it-IT"}, "pt": {"code": "pt-PT"}, "no": {"code": "nb-NO"}};
const WORDS7={"es": {"ryder": ["Ryder", "Ryder"], "grandpa": ["El abuelo", "Grandpa"], "daniel": ["Daniel", "Daniel"], "hammer": ["El martillo", "hammer"], "paintbrush": ["El pincel", "paintbrush"], "paint": ["La pintura", "paint"], "birdhouse": ["La casita para pájaros", "birdhouse"], "birdhouse2": ["La casita para pájaros", "birdhouse"], "birdfeeder": ["El comedero para pájaros", "bird feeder"], "cardinal": ["El cardenal", "cardinal"], "woodpecker": ["El pájaro carpintero", "woodpecker"], "bluebird": ["El pájaro azul", "bluebird"], "butterfly": ["La mariposa", "butterfly"], "rv": ["La casa rodante", "RV"], "solarpanel": ["El panel solar", "solar panel"], "lake": ["El lago", "lake"], "waterfall": ["La cascada", "waterfall"], "mountain": ["La montaña", "mountain"], "flowers": ["Las flores", "flowers"], "tools": ["Las herramientas", "tools"], "tree": ["El árbol", "tree"]}, "fr": {"ryder": ["Ryder", "Ryder"], "grandpa": ["Grand-père", "Grandpa"], "daniel": ["Daniel", "Daniel"], "hammer": ["Le marteau", "hammer"], "paintbrush": ["Le pinceau", "paintbrush"], "paint": ["La peinture", "paint"], "birdhouse": ["La cabane à oiseaux", "birdhouse"], "birdhouse2": ["La cabane à oiseaux", "birdhouse"], "birdfeeder": ["La mangeoire à oiseaux", "bird feeder"], "cardinal": ["Le cardinal", "cardinal"], "woodpecker": ["Le pic", "woodpecker"], "bluebird": ["L'oiseau bleu", "bluebird"], "butterfly": ["Le papillon", "butterfly"], "rv": ["Le camping-car", "RV"], "solarpanel": ["Le panneau solaire", "solar panel"], "lake": ["Le lac", "lake"], "waterfall": ["La cascade", "waterfall"], "mountain": ["La montagne", "mountain"], "flowers": ["Les fleurs", "flowers"], "tools": ["Les outils", "tools"], "tree": ["L'arbre", "tree"]}, "en": {"ryder": ["Ryder", "Ryder"], "grandpa": ["Grandpa", "Grandpa"], "daniel": ["Daniel", "Daniel"], "hammer": ["hammer", "hammer"], "paintbrush": ["paintbrush", "paintbrush"], "paint": ["paint", "paint"], "birdhouse": ["birdhouse", "birdhouse"], "birdhouse2": ["birdhouse", "birdhouse"], "birdfeeder": ["bird feeder", "bird feeder"], "cardinal": ["cardinal", "cardinal"], "woodpecker": ["woodpecker", "woodpecker"], "bluebird": ["bluebird", "bluebird"], "butterfly": ["butterfly", "butterfly"], "rv": ["RV", "RV"], "solarpanel": ["solar panel", "solar panel"], "lake": ["lake", "lake"], "waterfall": ["waterfall", "waterfall"], "mountain": ["mountain", "mountain"], "flowers": ["flowers", "flowers"], "tools": ["tools", "tools"], "tree": ["tree", "tree"]}, "de": {"ryder": ["Ryder", "Ryder"], "grandpa": ["Opa", "Grandpa"], "daniel": ["Daniel", "Daniel"], "hammer": ["Der Hammer", "hammer"], "paintbrush": ["Der Pinsel", "paintbrush"], "paint": ["Die Farbe", "paint"], "birdhouse": ["Das Vogelhaus", "birdhouse"], "birdhouse2": ["Das Vogelhaus", "birdhouse"], "birdfeeder": ["Das Vogelfutterhaus", "bird feeder"], "cardinal": ["Der Kardinal", "cardinal"], "woodpecker": ["Der Specht", "woodpecker"], "bluebird": ["Der Blauvogel", "bluebird"], "butterfly": ["Der Schmetterling", "butterfly"], "rv": ["Das Wohnmobil", "RV"], "solarpanel": ["Das Solarpanel", "solar panel"], "lake": ["Der See", "lake"], "waterfall": ["Der Wasserfall", "waterfall"], "mountain": ["Der Berg", "mountain"], "flowers": ["Die Blumen", "flowers"], "tools": ["Die Werkzeuge", "tools"], "tree": ["Der Baum", "tree"]}, "it": {"ryder": ["Ryder", "Ryder"], "grandpa": ["Il nonno", "Grandpa"], "daniel": ["Daniel", "Daniel"], "hammer": ["Il martello", "hammer"], "paintbrush": ["Il pennello", "paintbrush"], "paint": ["La vernice", "paint"], "birdhouse": ["La casetta per uccelli", "birdhouse"], "birdhouse2": ["La casetta per uccelli", "birdhouse"], "birdfeeder": ["La mangiatoia per uccelli", "bird feeder"], "cardinal": ["Il cardinale", "cardinal"], "woodpecker": ["Il picchio", "woodpecker"], "bluebird": ["L'uccello azzurro", "bluebird"], "butterfly": ["La farfalla", "butterfly"], "rv": ["Il camper", "RV"], "solarpanel": ["Il pannello solare", "solar panel"], "lake": ["Il lago", "lake"], "waterfall": ["La cascata", "waterfall"], "mountain": ["La montagna", "mountain"], "flowers": ["I fiori", "flowers"], "tools": ["Gli attrezzi", "tools"], "tree": ["L'albero", "tree"]}, "pt": {"ryder": ["Ryder", "Ryder"], "grandpa": ["O avô", "Grandpa"], "daniel": ["Daniel", "Daniel"], "hammer": ["O martelo", "hammer"], "paintbrush": ["O pincel", "paintbrush"], "paint": ["A tinta", "paint"], "birdhouse": ["A casa de pássaros", "birdhouse"], "birdhouse2": ["A casa de pássaros", "birdhouse"], "birdfeeder": ["O comedouro de pássaros", "bird feeder"], "cardinal": ["O cardeal", "cardinal"], "woodpecker": ["O pica-pau", "woodpecker"], "bluebird": ["O pássaro azul", "bluebird"], "butterfly": ["A borboleta", "butterfly"], "rv": ["O trailer", "RV"], "solarpanel": ["O painel solar", "solar panel"], "lake": ["O lago", "lake"], "waterfall": ["A cachoeira", "waterfall"], "mountain": ["A montanha", "mountain"], "flowers": ["As flores", "flowers"], "tools": ["As ferramentas", "tools"], "tree": ["A árvore", "tree"]}, "no": {"ryder": ["Ryder", "Ryder"], "grandpa": ["Bestefar", "Grandpa"], "daniel": ["Daniel", "Daniel"], "hammer": ["Hammeren", "hammer"], "paintbrush": ["Penselen", "paintbrush"], "paint": ["Malingen", "paint"], "birdhouse": ["Fuglehuset", "birdhouse"], "birdhouse2": ["Fuglehuset", "birdhouse"], "birdfeeder": ["Fuglemateren", "bird feeder"], "cardinal": ["Kardinalen", "cardinal"], "woodpecker": ["Hakkespetten", "woodpecker"], "bluebird": ["Blåfuglen", "bluebird"], "butterfly": ["Sommerfuglen", "butterfly"], "rv": ["Bobilen", "RV"], "solarpanel": ["Solpanelet", "solar panel"], "lake": ["Innsjøen", "lake"], "waterfall": ["Fossen", "waterfall"], "mountain": ["Fjellet", "mountain"], "flowers": ["Blomstene", "flowers"], "tools": ["Verktøyene", "tools"], "tree": ["Treet", "tree"]}};
const languageSelect=document.getElementById("birdLanguage");
const voiceSelect=document.getElementById("birdVoice");
languageSelect.value=localStorage.getItem("talkabee-learn-language")||"es";
function currentLang(){return languageSelect.value}
function objectWord(k){return (WORDS7[currentLang()]&&WORDS7[currentLang()][k])||WORDS7.es[k]}
function fillBirdVoices(){
 const base=LANGS[currentLang()].code.split("-")[0].toLowerCase();
 const saved=localStorage.getItem("talkabee-bird-voice-"+currentLang())||"";
 const vs=(speechSynthesis.getVoices()||[]).filter(v=>(v.lang||"").toLowerCase().startsWith(base));
 voiceSelect.innerHTML='<option value="">Browser Default</option>';
 vs.forEach(v=>voiceSelect.add(new Option(v.name+" — "+v.lang,v.name)));
 if([...voiceSelect.options].some(o=>o.value===saved)) voiceSelect.value=saved;
}

const challengeOrder=["birdhouse","hammer","paintbrush","birdfeeder","bluebird","butterfly"];
let active="meet",index=0,challenge=-1,solved=false,discovery=false;
const $=id=>document.getElementById(id);
const title=$("title"),prompt=$("prompt"),line=$("line"),translation=$("translation"),
 actions=$("actions"),find=$("find"),count=$("count"),status=$("status"),
 hint=$("hint"),challengeNext=$("challengeNext");

function speak(t){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang=LANGS[currentLang()].code;
 u.rate=.82;
 const chosen=speechSynthesis.getVoices().find(v=>v.name===voiceSelect.value);
 if(chosen) u.voice=chosen;
 speechSynthesis.speak(u);
}
function clearActive(){document.querySelectorAll(".directory button").forEach(b=>b.classList.remove("active"))}
function render(){const x=lessons[active].lines[index];line.textContent=x[0];translation.textContent=x[1]}
function loadLesson(k){
 active=k;index=0;challenge=-1;discovery=false;solved=false;
 find.classList.remove("show");actions.style.display="flex";
 const l=lessons[k];title.textContent=l.title;prompt.textContent=l.prompt;render();
 clearActive();document.querySelector('[data-lesson="'+k+'"]').classList.add("active");
}
function loadDiscovery(){
 challenge=-1;discovery=true;find.classList.remove("show");actions.style.display="none";
 title.textContent="Click & Discover";
 prompt.textContent="Click objects anywhere in the scene to learn their names.";
 line.textContent="Explora el santuario.";
 translation.textContent="Explore the Bird Sanctuary.";
 clearActive();document.querySelector("[data-discovery]").classList.add("active");
}
function cleanEnglish(x){return x.replace(/^The /,"").replace(/\.$/,"")}
function loadChallenge(i){
 challenge=i;discovery=false;solved=false;actions.style.display="none";find.classList.add("show");
 const key=challengeOrder[i],x=objectWord(key);
 title.textContent="Challenge "+(i+1)+": Find "+cleanEnglish(x[1])+".";
 prompt.textContent="Search the scene and click the correct object.";
 line.textContent=x[0];translation.textContent=x[1];
 count.textContent="CHALLENGE "+(i+1)+" OF 6";
 status.textContent="";
 hint.textContent="Find the correct object to unlock the next challenge.";
 challengeNext.textContent=i<5?"Next Challenge →":"Finish Challenges ✓";
 clearActive();document.querySelector('[data-challenge="'+i+'"]').classList.add("active");
}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>loadLesson(b.dataset.lesson));
document.querySelector("[data-discovery]").onclick=loadDiscovery;
document.querySelectorAll("[data-challenge]").forEach(b=>b.onclick=()=>loadChallenge(Number(b.dataset.challenge)));
$("next").onclick=()=>{index=(index+1)%lessons[active].lines.length;render()};
$("speak").onclick=()=>speak(lessons[active].lines[index][0]);

document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{
 const key=b.dataset.word,x=objectWord(key);
 if(challenge>=0){
   const target=challengeOrder[challenge];
   const correct=(key===target)||(target==="birdhouse"&&key==="birdhouse2");
   if(correct){
     solved=true;status.textContent="✓ Nice find! "+x[0]+" "+x[1];
     status.style.color="#176a48";hint.textContent="Challenge complete. Move to the next one.";speak(x[0]);
   } else {
     status.textContent="Not that one — keep looking.";status.style.color="#85580f";
   }
   return;
 }
 if(discovery){
   title.textContent="Click & Discover";prompt.textContent="You found something in the scene.";
   line.textContent=x[0];translation.textContent=x[1];speak(x[0]);
 }
});


document.getElementById("sceneView").onclick=()=>document.getElementById("birdWorld").classList.add("scene-only");
document.getElementById("restorePanel").onclick=()=>document.getElementById("birdWorld").classList.remove("scene-only");
languageSelect.onchange=()=>{
 localStorage.setItem("talkabee-learn-language",currentLang());
 fillBirdVoices();
 if(discovery) loadDiscovery();
 else if(challenge>=0) loadChallenge(challenge);
};
voiceSelect.onchange=()=>localStorage.setItem("talkabee-bird-voice-"+currentLang(),voiceSelect.value);
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillBirdVoices;fillBirdVoices();}

challengeNext.onclick=()=>{
 if(!solved){status.textContent="Find the correct object first.";status.style.color="#85580f";return}
 if(challenge<5) loadChallenge(challenge+1);
 else {
   status.textContent="🏁 You completed all 6 Bird Sanctuary challenges!";
   status.style.color="#176a48";hint.textContent="Great job exploring with Ryder and Daniel.";
 }
};
loadLesson("meet");
})();
</script>
</body>
</html>
