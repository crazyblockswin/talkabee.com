<script id="tab-sound-runtime">
(function(){'use strict';
const stage=document.querySelector('main.world'),data=document.getElementById('tab-sound-data');if(!stage||!data)return;
let spots=[];try{spots=JSON.parse(data.textContent)||[]}catch(e){console.warn('Sound hotspot data',e)}
const layer=document.createElement('div');layer.id='tab-sound-layer';stage.appendChild(layer);
const audio=new Audio();let editing=false,selected=-1,drawMode=false,preview=new Map();
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
function persist(){data.textContent=JSON.stringify(spots).replace(/</g,'\\u003c')}
function play(spot){if(!spot||!spot.sound)return;audio.pause();audio.currentTime=0;audio.src=preview.get(spot.sound)||spot.sound;audio.play().catch(err=>console.warn('Could not play hotspot audio:',err))}
