<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talk A Bee — Feelings & Expressions</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#fff6e8;background:radial-gradient(ellipse at 75% 10%,#477ca3 0,transparent 45%),linear-gradient(145deg,#142b45,#153b53 48%,#244c5b);min-height:100vh}a{color:inherit;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;padding:8px 22px;background:#0a2036c4;border-bottom:1px solid #ffffff44;gap:15px;flex-wrap:wrap}.brand{display:flex;align-items:center;font-size:26px;font-weight:bold;gap:8px}.brand img{width:55px;height:55px;object-fit:contain}nav{display:flex;gap:5px;flex-wrap:wrap}nav a{font-size:12px;border:1px solid #ffffff55;border-radius:20px;padding:7px 9px;background:#ffffff17}nav a[aria-current=page]{background:#e5bd67;color:#18283c;font-weight:bold}main{max-width:1170px;margin:auto;padding:16px}.heading{text-align:center;margin-bottom:15px}.heading h1{font-size:30px;margin:5px}.heading p{font-size:14px;margin:3px;color:#e0e9ef}.settings{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0 20px}.settings label{display:flex;gap:6px;align-items:center;font-size:13px}select{font:inherit;border:1px solid #ffffff88;border-radius:9px;padding:7px;background:#f9f5ec;color:#172b3c;max-width:190px}.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}.item{min-height:135px;border:1px solid #ffffff66;background:#ffffff18;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;padding:10px;cursor:pointer;font:inherit;transition:background .15s,transform .15s}.item:hover,.item:focus-visible{background:#ffffff32;transform:translateY(-2px);outline:2px solid #ffe18b}.art{font-size:52px;line-height:1.1}.name{font-size:15px;font-weight:bold}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.open{display:flex}.popup{position:relative;background:#303030;border:2px solid #a0a0a0;box-shadow:0 18px 60px #0008;border-radius:20px;max-width:430px;width:100%;text-align:center;padding:24px;color:white}.popup .lang{color:#ffffff;font-size:12px;letter-spacing:1px}.popup .word{font-size:27px;font-weight:bold;margin:7px 0 14px}.popup button{border:1px solid #ffffff55;border-radius:10px;background:#606060;color:#ffffff;padding:9px 14px;margin:3px;cursor:pointer;font:inherit}.popup .x{position:absolute;top:8px;right:8px;background:#ffffff26;color:white;padding:5px 10px}.note{text-align:center;font-size:12px;color:#dbe4e9;margin:18px auto;max-width:700px}@media(max-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.item{min-height:125px}.brand{font-size:21px}nav a{font-size:11px}.art{font-size:42px}}.tab-section-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 18px}.tab-section-nav a{display:inline-block;background:#303030;color:#fff;border:1px solid #888;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:bold;text-decoration:none}.tab-section-nav a:hover,.tab-section-nav a:focus-visible{background:#505050;outline:2px solid #ffe18b}@media(max-width:560px){.tab-section-nav a{font-size:12px;padding:9px 10px}}</style><style id="tab-learning-section-nav">.tab-section-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px auto 16px;max-width:960px}.tab-section-nav a{display:inline-block;padding:11px 17px;background:#303030;color:#fff;border:1px solid #999;border-radius:12px;font-weight:bold;font-size:14px}.tab-section-nav a:hover,.tab-section-nav a:focus-visible{background:#606060;outline:2px solid #fff}</style></head><body><header><a class="brand" href="Talk-A-Bee-Main-Directory.html"><img src="images/Talk-A-Bee-Header-Transparent.png" alt="Talk A Bee mascot">Talk A Bee</a><nav aria-label="Directories"><a href="Talk-A-Bee-Main-Directory.html">Main Directory</a><a href="numbers.html">Numbers</a><a href="picture-learning.html">Pictures</a><a href="time-calendar.html">Time</a><a href="colors-shapes.html">Colors</a><a href="feelings-expressions.html" aria-current="page">Feelings</a><a href="index.html">Adventures</a></nav></header><main><div class="heading"><h1>Feelings & Expressions</h1><p>Express Yourself</p></div><div class="settings"><label>Native language <select id="native"></select></label><label>Learning language <select id="learn"></select></label><label>Voice <select id="voice"></select></label></div><nav class="tab-section-nav" aria-label="Learning section navigation"><a href="colors-shapes.html" title="Colors & Shapes">‹ Previous: Colors & Shapes</a><a href="index.html" title="Adventures">Next: Adventures ›</a></nav><section class="tiles" id="items" aria-label="Feelings & Expressions items"></section><p class="note">Click any tile to see both languages and hear the learning-language word. Speech availability depends on voices installed in your browser.</p></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Word translation"><div class="popup"><button class="x" id="close" aria-label="Close">×</button><div class="lang" id="nativeLabel"></div><div class="word" id="nativeWord"></div><div class="lang" id="learnLabel"></div><div class="word" id="learnWord"></div><button id="speak">🔊 Speak</button><button id="slow">🐢 Slow</button></div></div><script>const DATA=[{"icon": "😊", "words": ["Happy", "Feliz", "Heureux", "Glücklich", "Felice", "Feliz", "Glad", "Χαρούμενος"]}, {"icon": "😢", "words": ["Sad", "Triste", "Triste", "Traurig", "Triste", "Triste", "Trist", "Λυπημένος"]}, {"icon": "😮", "words": ["Surprised", "Sorprendido", "Surpris", "Überrascht", "Sorpreso", "Surpreso", "Overrasket", "Έκπληκτος"]}, {"icon": "😠", "words": ["Angry", "Enojado", "En colère", "Wütend", "Arrabbiato", "Zangado", "Sint", "Θυμωμένος"]}, {"icon": "😴", "words": ["Tired", "Cansado", "Fatigué", "Müde", "Stanco", "Cansado", "Trøtt", "Κουρασμένος"]}, {"icon": "😨", "words": ["Scared", "Asustado", "Effrayé", "Ängstlich", "Spaventato", "Assustado", "Redd", "Φοβισμένος"]}, {"icon": "🥰", "words": ["Loved", "Amado", "Aimé", "Geliebt", "Amato", "Amado", "Elsket", "Αγαπημένος"]}, {"icon": "😕", "words": ["Confused", "Confundido", "Confus", "Verwirrt", "Confuso", "Confuso", "Forvirret", "Μπερδεμένος"]}, {"icon": "🤩", "words": ["Excited", "Emocionado", "Enthousiaste", "Aufgeregt", "Entusiasta", "Animado", "Begeistret", "Ενθουσιασμένος"]}, {"icon": "😌", "words": ["Calm", "Tranquilo", "Calme", "Ruhig", "Calmo", "Calmo", "Rolig", "Ήρεμος"]}];const LANGS={en:'English',es:'Spanish',fr:'French',de:'German',it:'Italian',pt:'Portuguese',no:'Norwegian',el:'Greek'};
const $=id=>document.getElementById(id);let active=null;
function getSaved(keys,fallback){for(const k of keys){let v=localStorage.getItem(k);if(v&&LANGS[v])return v;}return fallback}
const learn=$('learn'),native=$('native'),voice=$('voice');
for(const [code,name] of Object.entries(LANGS)){for(const sel of [learn,native]){const o=document.createElement('option');o.value=code;o.textContent=name;sel.append(o)}}
learn.value=getSaved(['talkabee-learn-language'],'es');native.value=getSaved(['talkabee-native-language','talkabee-preferred-language'],'en');
learn.addEventListener('change',()=>{localStorage.setItem('talkabee-learn-language',learn.value);render()});native.addEventListener('change',()=>{localStorage.setItem('talkabee-native-language',native.value);render()});
let available=[];function voices(){available=speechSynthesis.getVoices();voice.innerHTML='';let filtered=available.filter(v=>v.lang.toLowerCase().startsWith(learn.value==='no'?'nb':learn.value));if(learn.value==='no')filtered=available.filter(v=>/^n[bo]/i.test(v.lang));for(const v of filtered){const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';voice.append(o)}let saved=localStorage.getItem('talkabee-voice-'+learn.value);if(saved&&[...voice.options].some(o=>o.value===saved))voice.value=saved; if(!filtered.length){const o=document.createElement('option');o.textContent='Browser default voice';o.value='';voice.append(o)}}
voice.addEventListener('change',()=>localStorage.setItem('talkabee-voice-'+learn.value,voice.value));learn.addEventListener('change',voices);if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=voices;voices()}
function word(item,code){const index=['en','es','fr','de','it','pt','no','el'].indexOf(code);return item.words[index]||item.words[0]}
function render(){const grid=$('items');grid.innerHTML='';DATA.forEach((item,i)=>{let b=document.createElement('button');b.className='item';b.type='button';b.innerHTML='<span class="art" aria-hidden="true"></span><span class="name"></span>';b.querySelector('.art').textContent=item.icon;b.querySelector('.name').textContent=word(item,learn.value);b.addEventListener('click',()=>show(i));grid.append(b)})}
function show(i){active=DATA[i];$('nativeLabel').textContent=LANGS[native.value].toUpperCase();$('learnLabel').textContent=LANGS[learn.value].toUpperCase();$('nativeWord').textContent=word(active,native.value);$('learnWord').textContent=word(active,learn.value);$('overlay').classList.add('open');$('close').focus();speak(false)}
function close(){if('speechSynthesis'in window)speechSynthesis.cancel();$('overlay').classList.remove('open');active=null}
function speak(slow){if(!active||!('speechSynthesis'in window))return;speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(word(active,learn.value));utter.lang=({no:'nb-NO',el:'el-GR',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',pt:'pt-PT'})[learn.value];utter.rate=slow?.75:1;const v=available.find(v=>v.voiceURI===voice.value);if(v)utter.voice=v;speechSynthesis.speak(utter)}
$('close').addEventListener('click',close);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('speak').addEventListener('click',()=>speak(false));$('slow').addEventListener('click',()=>speak(true));render();</script></body></html>
