<script>

it:{resort:"stazione sciistica",mountain:"montagna",chairlift:"seggiovia",skiers:"sciatori",trails:"piste",lift:"impianto di risalita",rentals:"noleggio sci",school:"scuola di sci",cafe:"caffè",skis:"sci",snowboard:"snowboard",bee:"ape",grandma:"nonna",grandpa:"nonno",lodge:"rifugio sciistico",resortsign:"cartello della stazione sciistica",firepit:"braciere",chairs:"sedie",trees:"pini",snow:"neve"},
pt:{resort:"estação de esqui",mountain:"montanha",chairlift:"teleférico",skiers:"esquiadores",trails:"pistas",lift:"elevador de esqui",rentals:"aluguel de esquis",school:"escola de esqui",cafe:"café",skis:"esquis",snowboard:"prancha de snowboard",bee:"abelha",grandma:"avó",grandpa:"avô",lodge:"chalé de esqui",resortsign:"placa da estação de esqui",firepit:"fogueira",chairs:"cadeiras",trees:"pinheiros",snow:"neve"},
no:{resort:"skianlegg",mountain:"fjell",chairlift:"stolheis",skiers:"skiløpere",trails:"skiløyper",lift:"skiheis",rentals:"skiutleie",school:"skiskole",cafe:"kafé",skis:"ski",snowboard:"snøbrett",bee:"bie",grandma:"bestemor",grandpa:"bestefar",lodge:"skihytte",resortsign:"skianleggsskilt",firepit:"bålplass",chairs:"stoler",trees:"furutrær",snow:"snø"}};
const SPEECH_LANG={es:"es-ES",fr:"fr-FR",en:"en-US",de:"de-DE",it:"it-IT",pt:"pt-PT",no:"nb-NO"};
const lessons={
en:{arrive:["We have arrived at the mountain ski resort.","The snowy mountain is ready for a day of adventure."],gear:["We need skis, boots, poles, and warm clothes.","The rental area has equipment for the slopes."],lift:["The chairlift carries skiers up the mountain.","We sit safely and enjoy the view on the way up."],slopes:["Skiers glide down the snowy trails.","Some trails are gentle and others are steep."],lodge:["The ski lodge is warm and cozy.","People can rest, eat, and warm up inside."],winter:["There are many ways to enjoy a snowy mountain.","We can ski, snowboard, relax by the fire, and play in the snow."]},
es:{arrive:["Hemos llegado a la estación de esquí.","La montaña nevada está lista para un día de aventura."],gear:["Necesitamos esquís, botas, bastones y ropa abrigada.","La zona de alquiler tiene equipo para las pistas."],lift:["El telesilla lleva a los esquiadores montaña arriba.","Nos sentamos con seguridad y disfrutamos de la vista."],slopes:["Los esquiadores bajan por las pistas nevadas.","Algunas pistas son suaves y otras son empinadas."],lodge:["El refugio de esquí es cálido y acogedor.","La gente puede descansar, comer y calentarse dentro."],winter:["Hay muchas maneras de disfrutar de una montaña nevada.","Podemos esquiar, hacer snowboard, descansar junto al fuego y jugar en la nieve."]},
fr:{arrive:["Nous sommes arrivés à la station de ski.","La montagne enneigée est prête pour une journée d'aventure."],gear:["Nous avons besoin de skis, de bottes, de bâtons et de vêtements chauds.","La location propose du matériel pour les pistes."],lift:["Le télésiège transporte les skieurs en haut de la montagne.","Nous nous asseyons en sécurité et profitons de la vue."],slopes:["Les skieurs glissent sur les pistes enneigées.","Certaines pistes sont douces et d'autres sont raides."],lodge:["Le chalet de ski est chaud et confortable.","On peut s'y reposer, manger et se réchauffer."],winter:["Il y a beaucoup de façons de profiter d'une montagne enneigée.","Nous pouvons skier, faire du snowboard, nous détendre près du feu et jouer dans la neige."]},
de:{arrive:["Wir sind im Skigebiet angekommen.","Der verschneite Berg ist bereit für einen Abenteuertag."],gear:["Wir brauchen Skier, Stiefel, Stöcke und warme Kleidung.","Beim Skiverleih gibt es Ausrüstung für die Pisten."],lift:["Der Sessellift bringt Skifahrer den Berg hinauf.","Wir sitzen sicher und genießen die Aussicht."],slopes:["Skifahrer gleiten die verschneiten Pisten hinunter.","Manche Pisten sind sanft und andere steil."],lodge:["Die Skihütte ist warm und gemütlich.","Drinnen kann man sich ausruhen, essen und aufwärmen."],winter:["Auf einem verschneiten Berg gibt es viel zu erleben.","Wir können Ski fahren, snowboarden, am Feuer sitzen und im Schnee spielen."]},
it:{arrive:["Siamo arrivati alla stazione sciistica.","La montagna innevata è pronta per una giornata di avventura."],gear:["Ci servono sci, scarponi, bastoncini e vestiti caldi.","Il noleggio ha l'attrezzatura per le piste."],lift:["La seggiovia porta gli sciatori sulla montagna.","Ci sediamo in sicurezza e ci godiamo il panorama."],slopes:["Gli sciatori scivolano sulle piste innevate.","Alcune piste sono dolci e altre sono ripide."],lodge:["Il rifugio sciistico è caldo e accogliente.","Dentro si può riposare, mangiare e riscaldarsi."],winter:["Ci sono molti modi per divertirsi su una montagna innevata.","Possiamo sciare, fare snowboard, rilassarci vicino al fuoco e giocare nella neve."]},
pt:{arrive:["Chegamos à estação de esqui.","A montanha nevada está pronta para um dia de aventura."],gear:["Precisamos de esquis, botas, bastões e roupas quentes.","A área de aluguel tem equipamentos para as pistas."],lift:["O teleférico leva os esquiadores montanha acima.","Sentamos com segurança e apreciamos a vista."],slopes:["Os esquiadores deslizam pelas pistas nevadas.","Algumas pistas são suaves e outras são íngremes."],lodge:["O chalé de esqui é quente e aconchegante.","As pessoas podem descansar, comer e se aquecer lá dentro."],winter:["Há muitas maneiras de aproveitar uma montanha nevada.","Podemos esquiar, praticar snowboard, relaxar perto do fogo e brincar na neve."]},
no:{arrive:["Vi har kommet til skianlegget.","Det snødekte fjellet er klart for en dag med eventyr."],gear:["Vi trenger ski, støvler, staver og varme klær.","Skiutleien har utstyr til bakkene."],lift:["Stolheisen frakter skiløpere opp fjellet.","Vi sitter trygt og nyter utsikten på vei opp."],slopes:["Skiløpere glir ned de snødekte løypene.","Noen løyper er slake og andre er bratte."],lodge:["Skihytta er varm og koselig.","Folk kan hvile, spise og varme seg inne."],winter:["Det finnes mange måter å nyte et snødekt fjell på.","Vi kan stå på ski, kjøre snowboard, slappe av ved bålet og leke i snøen."]}};
const challengeOrder=["chairlift","skis","grandma","grandpa","bee","firepit"];
const SOUND_MAP={firepit:"sounds/fire.mp3"};
const langSel=document.getElementById("lang"),voiceSel=document.getElementById("voice");
const title=document.getElementById("title"),prompt=document.getElementById("prompt"),line=document.getElementById("line"),translation=document.getElementById("translation"),status=document.getElementById("status"),world=document.getElementById("world");
let lastWord="resort",activeLesson="",lessonPhrase=1,challenge=-1,lastSpoken="";
function voices(){return ("speechSynthesis" in window)?speechSynthesis.getVoices():[]}
function fillVoices(){const old=localStorage.getItem("talkabee-ski-voice-"+langSel.value)||"";voiceSel.innerHTML='<option value="">Browser Default</option>';voices().forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+(v.lang?" — "+v.lang:"");voiceSel.appendChild(o)});if([...voiceSel.options].some(o=>o.value===old))voiceSel.value=old}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices();setTimeout(fillVoices,150);setTimeout(fillVoices,600);setTimeout(fillVoices,1500)}
voiceSel.onchange=()=>localStorage.setItem("talkabee-ski-voice-"+langSel.value,voiceSel.value);
function speak(text,rate=.88,onend=null){if(!text||!("speechSynthesis" in window)){if(onend)onend();return}speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH_LANG[langSel.value]||langSel.value;u.rate=rate;const v=speechSynthesis.getVoices().find(x=>x.name===voiceSel.value);if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u)},50);lastSpoken=text}
function stopSound(){document.querySelectorAll("audio[data-talkabee-sound]").forEach(a=>{a.pause();a.currentTime=0;a.remove()})}
function playSound(key){stopSound();const src=SOUND_MAP[key];if(!src)return;const a=new Audio(src);a.dataset.talkabeeSound="1";document.body.appendChild(a);a.play().catch(()=>{});a.onended=()=>a.remove()}
function showWord(key){activeLesson="";lastWord=key;lessonPhrase=1;title.textContent="Click & Discover";prompt.textContent="You found "+(EN[key]||key)+".";line.textContent=WORDS[langSel.value][key]||EN[key]||key;translation.textContent=langSel.value==="en"?"":(EN[key]||key)}
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{const key=b.dataset.word;showWord(key);let played=false;const after=()=>{if(played)return;played=true;playSound(key)};speak(WORDS[langSel.value][key]||EN[key]||key,.82,after);setTimeout(after,1500);if(challenge>=0){if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.color="#9dffbf"}else{status.textContent="Not that one — keep looking.";status.style.color="#ffe28a"}}});
function clearChallenge(){challenge=-1;world.classList.remove("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.remove("target"));status.textContent=""}
document.getElementById("discovery").onclick=()=>{clearChallenge();activeLesson="";lastWord="resort";title.textContent="Click & Discover";prompt.textContent="Click any object in the scene to hear its name.";line.textContent=WORDS[langSel.value].resort;translation.textContent=langSel.value==="en"?"":EN.resort};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{activeLesson="";lastWord="";challenge=+b.dataset.ch;world.classList.add("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^[0-9]+\.\s*/,"");line.textContent=WORDS[langSel.value][challengeOrder[challenge]];translation.textContent=langSel.value==="en"?"":EN[challengeOrder[challenge]];status.textContent=""});
function showLesson(key,speakIt=false){clearChallenge();activeLesson=key;lastWord="";lessonPhrase=Math.max(0,Math.min(1,lessonPhrase));const a=lessons[langSel.value][key],e=lessons.en[key],btn=document.querySelector(`[data-lesson="${key}"]`);title.textContent=btn?btn.textContent.replace(/^[0-9]+\.\s*/,""):"Mountain Ski Resort";prompt.textContent=a[0];line.textContent=a[lessonPhrase];translation.textContent=langSel.value==="en"?"":e[lessonPhrase];if(speakIt)speak(a[lessonPhrase])}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{lessonPhrase=1;showLesson(b.dataset.lesson,true)});
function currentSpeechText(){if(activeLesson)return lessons[langSel.value][activeLesson][lessonPhrase];if(lastWord)return WORDS[langSel.value][lastWord]||EN[lastWord];return line.textContent}
document.getElementById("normal").onclick=()=>speak(currentSpeechText(),.82);
document.getElementById("slow").onclick=()=>speak(currentSpeechText(),.58);
document.getElementById("replay").onclick=()=>speak(lastSpoken||currentSpeechText(),.82);
document.getElementById("nextPhrase").onclick=()=>{if(!activeLesson){const keys=Object.keys(EN),i=Math.max(0,keys.indexOf(lastWord));showWord(keys[(i+1)%keys.length]);speak(currentSpeechText(),.82);return}lessonPhrase=(lessonPhrase+1)%2;showLesson(activeLesson,true)};
langSel.onchange=()=>{fillVoices();if(activeLesson)showLesson(activeLesson,false);else if(lastWord)showWord(lastWord)};
document.getElementById("sceneView").onclick=()=>document.body.classList.add("scene-view");
document.getElementById("sceneReturn").onclick=()=>document.body.classList.remove("scene-view");
