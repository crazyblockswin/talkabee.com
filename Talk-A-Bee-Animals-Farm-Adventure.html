function speak(txt,rate=1,onend=null){
 if(!('speechSynthesis' in window)){if(onend)onend();return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(txt);u.lang=data().speech;u.rate=rate;
 const chosen=speechSynthesis.getVoices().find(v=>v.name===voiceSelector.value);
 if(chosen)u.voice=chosen;
 if(onend)u.onend=onend;
 speechSynthesis.speak(u);
}
document.getElementById('sceneView').onclick=()=>world.classList.add('scene-only');
document.getElementById('restorePanel').onclick=()=>world.classList.remove('scene-only');
voiceSelector.addEventListener('change',()=>localStorage.setItem('talkabee-farm-voice-'+lang,voiceSelector.value));
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=fillFarmVoices;fillFarmVoices();}
const audioButtons=[document.getElementById('normal'),document.getElementById('slow'),document.getElementById('replay')];
function setAudioActive(button){audioButtons.forEach(b=>b.classList.remove('audio-active'));button.classList.add('audio-active')}
setAudioActive(document.getElementById('normal'));
document.getElementById('normal').onclick=function(){setAudioActive(this);speak(els.target.textContent,1)};
document.getElementById('slow').onclick=function(){setAudioActive(this);speak(els.target.textContent,.65)};
document.getElementById('replay').onclick=function(){setAudioActive(this);speak(els.target.textContent,.9)};
document.querySelectorAll('.hotspot').forEach(h=>h.addEventListener('click',()=>{
 const word=data().words[h.id]||englishNames[h.id]||h.id;
 if(challengeTarget){
   if(h.id===challengeTarget){els.status.textContent='✓ Correct!';speak(word,.8)}
   else{els.status.textContent='Try another animal.'}
   return;
 }
 els.target.textContent=word;
 els.translation.textContent=lang==='en'?'':englishNames[h.id];
 speak(word,.8,()=>playDiscoverySound(h.id));
}));
showLesson('pets');
</script>
<script id="talkabee-inclusive-browser-voices-v1">
(()=>{
  if(!('speechSynthesis' in window))return;
  const voiceSelects=()=>[...document.querySelectorAll('select')].filter(s=>/voice/i.test((s.id||'')+' '+(s.name||'')+' '+(s.className||'')));
  function fillAllBrowserVoices(){
    const voices=speechSynthesis.getVoices(); if(!voices.length)return;
    voiceSelects().forEach(sel=>{
      const chosen=sel.value;
      sel.innerHTML='';
      const d=document.createElement('option'); d.value=''; d.textContent='Browser Default'; sel.appendChild(d);
      voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+(v.lang?' — '+v.lang:'');sel.appendChild(o)});
      if([...sel.options].some(o=>o.value===chosen))sel.value=chosen;
    });
  }
  speechSynthesis.addEventListener?.('voiceschanged',fillAllBrowserVoices);
  window.addEventListener('load',()=>{fillAllBrowserVoices();setTimeout(fillAllBrowserVoices,150);setTimeout(fillAllBrowserVoices,600);setTimeout(fillAllBrowserVoices,1500)});
  document.addEventListener('change',e=>{if(e.target&&e.target.tagName==='SELECT'&&!/voice/i.test((e.target.id||'')+' '+(e.target.name||'')+' '+(e.target.className||'')))setTimeout(fillAllBrowserVoices,0)},true);
})();
</script>
