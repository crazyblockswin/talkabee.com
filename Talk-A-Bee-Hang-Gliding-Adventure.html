const challengeOrder=["eagle","waterfall","train","rv","deer","bee"];
const SOUND_MAP={};
const langSel=document.getElementById("lang"),voiceSel=document.getElementById("voice");
const title=document.getElementById("title"),prompt=document.getElementById("prompt"),line=document.getElementById("line"),translation=document.getElementById("translation"),status=document.getElementById("status"),world=document.getElementById("world");
let lastWord="hanggliding",activeLesson="",lessonPhrase=1,challenge=-1,lastSpoken="";
function voices(){return ("speechSynthesis" in window)?speechSynthesis.getVoices():[]}
function fillVoices(){const old=localStorage.getItem("talkabee-hanggliding-voice-"+langSel.value)||"";voiceSel.innerHTML='<option value="">Browser Default</option>';voices().forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+(v.lang?" — "+v.lang:"");voiceSel.appendChild(o)});if([...voiceSel.options].some(o=>o.value===old))voiceSel.value=old}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices();setTimeout(fillVoices,150);setTimeout(fillVoices,600);setTimeout(fillVoices,1500)}
voiceSel.onchange=()=>localStorage.setItem("talkabee-hanggliding-voice-"+langSel.value,voiceSel.value);
function speak(text,rate=.88,onend=null){if(!text||!("speechSynthesis" in window)){if(onend)onend();return}speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH_LANG[langSel.value]||langSel.value;u.rate=rate;const v=speechSynthesis.getVoices().find(x=>x.name===voiceSel.value);if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u)},50);lastSpoken=text}
function stopSound(){document.querySelectorAll("audio[data-talkabee-sound]").forEach(a=>{a.pause();a.currentTime=0;a.remove()})}
function playSound(key){stopSound();const src=SOUND_MAP[key];if(!src)return;const a=new Audio(src);a.dataset.talkabeeSound="1";document.body.appendChild(a);a.play().catch(()=>{});a.onended=()=>a.remove()}
function showWord(key){activeLesson="";lastWord=key;lessonPhrase=1;title.textContent="Click & Discover";prompt.textContent="You found "+(EN[key]||key)+".";line.textContent=WORDS[langSel.value][key]||EN[key]||key;translation.textContent=langSel.value==="en"?"":(EN[key]||key)}
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{const key=b.dataset.word;showWord(key);let played=false;const after=()=>{if(played)return;played=true;playSound(key)};speak(WORDS[langSel.value][key]||EN[key]||key,.82,after);setTimeout(after,1500);if(challenge>=0){if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.setProperty("color","#35e46a","important")}else{status.textContent="Not that one — keep looking.";status.style.setProperty("color","#ffe28a","important")}}});
function clearChallenge(){challenge=-1;world.classList.remove("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.remove("target"));status.textContent=""}
document.getElementById("discovery").onclick=()=>{clearChallenge();activeLesson="";lastWord="hanggliding";title.textContent="Click & Discover";prompt.textContent="Click any object in the scene to hear its name.";line.textContent=WORDS[langSel.value].hanggliding;translation.textContent=langSel.value==="en"?"":EN.hanggliding};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{activeLesson="";lastWord="";challenge=+b.dataset.ch;world.classList.add("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^[0-9]+\.\s*/,"");line.textContent=WORDS[langSel.value][challengeOrder[challenge]];translation.textContent=langSel.value==="en"?"":EN[challengeOrder[challenge]];status.textContent=""});
function showLesson(key,speakIt=false){clearChallenge();activeLesson=key;lastWord="";lessonPhrase=Math.max(0,Math.min(1,lessonPhrase));const a=lessons[langSel.value][key],e=lessons.en[key],btn=document.querySelector(`[data-lesson="${key}"]`);title.textContent=btn?btn.textContent.replace(/^[0-9]+\.\s*/,""):"Hang Gliding Adventure";prompt.textContent=a[0];line.textContent=a[lessonPhrase];translation.textContent=langSel.value==="en"?"":e[lessonPhrase];if(speakIt)speak(a[lessonPhrase])}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{lessonPhrase=1;showLesson(b.dataset.lesson,true)});
function currentSpeechText(){if(activeLesson)return lessons[langSel.value][activeLesson][lessonPhrase];if(lastWord)return WORDS[langSel.value][lastWord]||EN[lastWord]||lastWord;return line.textContent}
document.getElementById("normal").onclick=()=>speak(currentSpeechText(),.82);
document.getElementById("slow").onclick=()=>speak(currentSpeechText(),.58);

document.getElementById("nextPhrase").onclick=()=>{if(!activeLesson){const keys=Object.keys(EN),i=Math.max(0,keys.indexOf(lastWord));showWord(keys[(i+1)%keys.length]);speak(currentSpeechText(),.82);return}lessonPhrase=(lessonPhrase+1)%2;showLesson(activeLesson,true)};
langSel.onchange=()=>{fillVoices();if(activeLesson)showLesson(activeLesson,false);else if(lastWord)showWord(lastWord)};

<script id="talkabee-hotspot-custom-sound">
(function(){
 if(window.__talkabeeHotspotCustomSound)return;window.__talkabeeHotspotCustomSound=true;
 const SEL='.hotspot,.home-hotspot,.yacht-hotspot,.hotspots button,.train-hotspots button';
 let timer=0,current=null;
 function stop(){clearTimeout(timer);if(current){try{current.pause();current.currentTime=0}catch(e){}current=null}}
 document.addEventListener('click',function(ev){
  if(document.body.classList.contains('tb-hs-editing'))return;
  const h=ev.target.closest&&ev.target.closest(SEL);if(!h||!h.dataset.sound)return;
  stop();const src=h.dataset.sound;
  // Keep Talk A Bee order: translated object speech first, then the real sound.
  timer=setTimeout(function(){const a=new Audio(src);current=a;a.play().catch(()=>{});a.onended=function(){if(current===a)current=null}},1500);

<script id="talkabee-language-sync-repair-20261009">
(function(){
  const KEY='talkabee-learn-language';
  const language=document.getElementById('lang');
  if(!language)return;
  function restore(){
    let saved;
    try{saved=localStorage.getItem(KEY)}catch(e){return}
    if(saved && [...language.options].some(o=>o.value===saved) && language.value!==saved){
      language.value=saved;
      language.dispatchEvent(new Event('change',{bubbles:true}));
    }
  }
  language.addEventListener('change',function(){
    try{localStorage.setItem(KEY,language.value)}catch(e){}
  },true);
  restore();
  window.addEventListener('pageshow',restore);
  window.addEventListener('storage',function(e){if(e.key===KEY)restore()});
})();
</script>

<script id="talkabee-approved-card-learning-text">
/* Approved learning text sizes without changing A+/A- behavior.
   The existing font controls use data-base-font, so update those baselines too. */
(function(){
  function enlarge(){
    const card=document.querySelector('.tab-master-card');
    if(!card)return;
    const sizes={'.kicker':19,'#title':28,'#prompt':24,'#line':28,'#translation':24};
    const factor=parseFloat(getComputedStyle(card).getPropertyValue('--tab-card-font-scale'))||1;
    for(const [selector,base] of Object.entries(sizes)){
      const el=card.querySelector(selector);
      if(!el)return;
      el.dataset.baseFont=base+'px';
      el.style.setProperty('font-size',(base*factor)+'px','important');
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enlarge);
  else enlarge();
})();
</script>
