const hotelSceneSounds={
  campana:"sounds/bell.mp3",
  camara:"sounds/camera-shutter.mp3"

let hotelSceneAudio=null;
function playHotelSceneSound(key){
  const url=hotelSceneSounds[key];
  if(!url)return;
  if(hotelSceneAudio){
    hotelSceneAudio.pause();
    hotelSceneAudio.currentTime=0;
  }
  hotelSceneAudio=new Audio(url);
  hotelSceneAudio.volume=.82;
  hotelSceneAudio.play().catch(()=>{});
}

<script>
(function(){
  const GLOBAL_PREFIX='talkabee-voice-';
  function controls(){
    const selects=[...document.querySelectorAll('select')];
    const voice=selects.find(s=>/voice/i.test((s.id||'')+' '+(s.name||'')+' '+(s.getAttribute('aria-label')||'')));
    const language=selects.find(s=>/lang/i.test((s.id||'')+' '+(s.name||'')+' '+(s.getAttribute('aria-label')||'')));
    return {language,voice};
  }
  function voices(){return ('speechSynthesis' in window)?(speechSynthesis.getVoices()||[]):[];}
  function key(lang){return GLOBAL_PREFIX+lang;}
  function selectedVoiceURI(sel){
    if(!sel||!sel.value)return '';
    const vs=voices(), opt=sel.options[sel.selectedIndex];
    const raw=sel.value, label=(opt&&opt.textContent)||'';
    let v=vs.find(x=>x.voiceURI===raw)||vs.find(x=>x.name===raw);
    if(!v && label) v=vs.find(x=>label===x.name||label.startsWith(x.name+' —')||label.startsWith(x.name+' -'));
    return v?v.voiceURI:'';
  }
  function restore(){
    const {language,voice}=controls(); if(!language||!voice)return;
    const saved=localStorage.getItem(key(language.value))||''; if(!saved)return;
    const vs=voices(), target=vs.find(v=>v.voiceURI===saved); if(!target)return;
    const opts=[...voice.options];
    let opt=opts.find(o=>o.value===target.voiceURI)||opts.find(o=>o.value===target.name)||
            opts.find(o=>o.textContent===target.name||o.textContent.startsWith(target.name+' —')||o.textContent.startsWith(target.name+' -'));
    if(opt && voice.value!==opt.value){
      voice.value=opt.value;
      voice.dispatchEvent(new Event('change',{bubbles:true}));
    }
  }
  function save(){
    const {language,voice}=controls(); if(!language||!voice)return;
    const uri=selectedVoiceURI(voice);
    localStorage.setItem(key(language.value),uri);
  }
  function restoreLanguage(){
    const {language}=controls(); if(!language)return;
    const saved=localStorage.getItem('talkabee-learn-language')||'';
    if(saved && [...language.options].some(o=>o.value===saved) && language.value!==saved){
      language.value=saved;
      language.dispatchEvent(new Event('change',{bubbles:true}));
    }

<style id="talkabee-script-card-anywhere-drag-style">

<script id="talkabee-script-card-anywhere-drag">
(function(){
  const card=document.querySelector('.tab-master-card, .script-card');
  if(!card || card.dataset.anywhereDragReady==='1') return;
  card.dataset.anywhereDragReady='1';
  const PK='talkabee-script-card-position';
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  let state=null;
  card.addEventListener('pointerdown',function(e){
    if(window.innerWidth<=760 || e.button!==0) return;
    if(e.target.closest('button,a,input,select,textarea,.tab-card-resize,.tab-card-drag')) return;
    const r=card.getBoundingClientRect();
    state={id:e.pointerId,sx:e.clientX,sy:e.clientY,left:r.left,top:r.top,w:r.width,h:r.height,moved:false};
    card.setPointerCapture?.(e.pointerId);
  });
  card.addEventListener('pointermove',function(e){
    if(!state || e.pointerId!==state.id) return;
    const dx=e.clientX-state.sx,dy=e.clientY-state.sy;
    if(!state.moved && Math.hypot(dx,dy)<4) return;
    state.moved=true; e.preventDefault();
    card.classList.add('tab-anywhere-dragging');
    card.style.setProperty('left',clamp(state.left+dx,8,Math.max(8,innerWidth-state.w-8))+'px','important');
    card.style.setProperty('top',clamp(state.top+dy,8,Math.max(8,innerHeight-state.h-8))+'px','important');
    card.style.setProperty('right','auto','important');
    card.style.setProperty('bottom','auto','important');
    card.style.setProperty('transform','none','important');
  });
  function end(e){
    if(!state || e.pointerId!==state.id) return;
    if(state.moved){
      const r=card.getBoundingClientRect();
      try{localStorage.setItem(PK,JSON.stringify({left:r.left,top:r.top}))}catch(_){}
    }
    card.classList.remove('tab-anywhere-dragging');
    try{card.releasePointerCapture?.(e.pointerId)}catch(_){}
    state=null;
  }
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
})();
</script>
