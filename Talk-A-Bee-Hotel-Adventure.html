language.value=localStorage.getItem("talkabee-learn-language")||"es";
const lang=()=>language.value;
function fillVoices(){let base=LANGS[lang()].split("-")[0].toLowerCase(),saved=localStorage.getItem("talkabee-hotel-voice-"+lang())||"",vs=(speechSynthesis.getVoices()||[]).filter(v=>(v.lang||"").toLowerCase().startsWith(base));voice.innerHTML='<option value="">Browser Default</option>';vs.forEach(v=>voice.add(new Option(v.name+" — "+v.lang,v.name)));if([...voice.options].some(o=>o.value===saved))voice.value=saved}
function speak(t,rate=.82){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=LANGS[lang()];u.rate=rate;let v=speechSynthesis.getVoices().find(x=>x.name===voice.value);if(v)u.voice=v;last=t;speechSynthesis.speak(u)}
function clear(){document.querySelectorAll(".directory button").forEach(b=>b.classList.remove("active"))}
function render(){let d=LESSONS[lang()][active],en=LESSONS.en[active],x=d[2][idx];title.textContent=d[0];prompt.textContent=d[1];line.textContent=x;translation.textContent=lang()==="en"?"":en[2][idx];actions.style.display="flex";find.classList.remove("show")}
function lesson(k){active=k;idx=0;discovery=false;challenge=-1;clear();document.querySelector('[data-lesson="'+k+'"]').classList.add("active");render()}
function discover(){discovery=true;challenge=-1;clear();document.querySelector("[data-discovery]").classList.add("active");title.textContent="Discovery";prompt.textContent="Click highlighted objects to see the selected-language name and its English meaning.";line.textContent="";translation.textContent="";actions.style.display="none";find.classList.remove("show")}
function challengeLoad(n){challenge=n;discovery=false;solved=false;clear();document.querySelector('[data-challenge="'+n+'"]').classList.add("active");let x=WORDS[lang()][ORDER[n]];title.textContent="Challenge "+(n+1);prompt.textContent="Find the correct object in the hotel scene.";line.textContent=x[0];translation.textContent=lang()==="en"?"":x[1];actions.style.display="none";find.classList.add("show");count.textContent="CHALLENGE "+(n+1)+" OF 6";status.textContent="";hint.textContent="Click the correct object in the scene."}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>lesson(b.dataset.lesson));document.querySelector("[data-discovery]").onclick=discover;document.querySelectorAll("[data-challenge]").forEach(b=>b.onclick=()=>challengeLoad(+b.dataset.challenge));
$("next").onclick=()=>{idx=(idx+1)%LESSONS[lang()][active][2].length;render()};$("speak").onclick=()=>speak(LESSONS[lang()][active][2][idx]);$("slow").onclick=()=>speak(LESSONS[lang()][active][2][idx],.60);$("replay").onclick=()=>speak(last||LESSONS[lang()][active][2][idx]);
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{
 let k=b.dataset.word,x=WORDS[lang()][k];playHotelSceneSound(k);
 if(challenge>=0){
   if(k===ORDER[challenge]){
     solved=true;status.textContent="✓ "+x[0]+(lang()==="en"?"":" — "+x[1]);
     status.style.color="#176a48";hint.textContent="Challenge complete.";
   }else{
     status.textContent="Not that one — keep looking.";status.style.color="#85580f";
   }
   speak(x[0]);return;
 }
 if(discovery){
   title.textContent="Discovery";prompt.textContent="You found something in the hotel.";
   line.textContent=x[0];translation.textContent=lang()==="en"?"":x[1];
 }
 speak(x[0]);
});
$("challengeNext").onclick=()=>{if(!solved){status.textContent="Find the correct object first.";return}if(challenge<5)challengeLoad(challenge+1);else{status.textContent="🏁 You completed all 6 Hotel challenges!";hint.textContent="Great job exploring the hotel."}};
$("sceneView").onclick=()=>world.classList.add("scene-only");$("restorePanel").onclick=()=>world.classList.remove("scene-only");
language.onchange=()=>{localStorage.setItem("talkabee-learn-language",lang());fillVoices();if(discovery)discover();else if(challenge>=0)challengeLoad(challenge);else lesson(active)};voice.onchange=()=>localStorage.setItem("talkabee-hotel-voice-"+lang(),voice.value);
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices()}lesson("checkin")})();
</script></body></html>
