*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:#142d35;color:#172335}
button{font:inherit;cursor:pointer}
#world{position:fixed;inset:0;overflow:hidden;background:#142d35}

.place{font-size:15px;font-weight:950;line-height:1.1;margin:2px 2px 9px}
.label{margin:7px 3px 3px;font-size:9px;font-weight:950;letter-spacing:.14em;color:rgba(255,255,255,.78)}
.directory button{display:block;width:100%;margin:2px 0;padding:6px 8px;border:0;border-radius:10px;background:rgba(255,255,255,.10);color:#fff;text-align:left;font-size:11px;font-weight:850}
.directory button:hover,.directory button.active{background:rgba(18,151,142,.78)}
.main-directory{margin-bottom:8px!important;background:rgba(255,255,255,.18)!important;font-weight:950!important}
.panel{position:absolute;z-index:28;right:18px;bottom:18px;width:34%;max-width:650px;max-height:48%;overflow:auto;scrollbar-width:none;padding:12px 14px;border:1px solid rgba(255,255,255,.38);border-radius:20px;background:rgba(255,252,242,.25);backdrop-filter:blur(4px);box-shadow:0 12px 30px rgba(20,30,40,.18)}

.translation{font-size:12px;margin:5px 0 7px}
.actions{display:flex;gap:6px;margin-top:7px}
.actions button,.challengeNext{border:0;border-radius:10px;padding:8px 10px;background:rgba(25,115,106,.94);color:#fff;font-size:11px;font-weight:900}

.count{font-size:9px;font-weight:950;letter-spacing:.12em;color:#7b4a23;margin-bottom:5px}

.hotspots{position:absolute;inset:0;z-index:22;pointer-events:none}
.hotspot{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;opacity:.025;pointer-events:auto}

const englishWords={"bee":"Bee","book":"Book","lamp":"Lamp post","woman":"Woman","dog":"Dog","vegetables":"Vegetables","peppers":"Peppers","garlic":"Garlic","basket":"Basket","hat":"Hat","car":"Car","shopper":"Shopper","butcher":"Butcher","meat":"Meat","fish":"Fish","palm":"Palm tree","mountain":"Mountain","tower":"Tower","flowers":"Flowers","awning":"Awning"};
const challengeOrder=["dog","vegetables","fish","meat","car","bee"];
let active="greetings",index=0,challenge=-1,solved=false,discovery=false;
const $=id=>document.getElementById(id),title=$("title"),prompt=$("prompt"),line=$("line"),translation=$("translation"),actions=$("actions"),find=$("find"),count=$("count"),status=$("status"),hint=$("hint"),challengeNext=$("challengeNext"),languageSelect=$("adventureLanguage"),voiceSelect=$("adventureVoice");
const LANG_KEY="talkabee-learn-language",VOICE_KEY="talkabee-voice-";
let availableVoices=[];
function currentLang(){return languageData[languageSelect.value]?languageSelect.value:"es"}
function data(){return languageData[currentLang()]}
function voiceBase(){return data().speech.toLowerCase().split("-")[0]}
function refreshVoices(){
 if(!("speechSynthesis" in window)||!voiceSelect)return;
 availableVoices=speechSynthesis.getVoices()||[];
 const base=voiceBase(),matching=availableVoices.filter(v=>(v.lang||"").toLowerCase().split("-")[0]===base);
 const saved=localStorage.getItem(VOICE_KEY+currentLang())||"";
 voiceSelect.innerHTML="";
 const d=document.createElement("option");d.value="";d.textContent="Browser default";voiceSelect.appendChild(d);
 matching.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";voiceSelect.appendChild(o)});
 if([...voiceSelect.options].some(o=>o.value===saved))voiceSelect.value=saved;
}
function selectedVoice(){return availableVoices.find(v=>v.name===voiceSelect.value&&((v.lang||"").toLowerCase().split("-")[0]===voiceBase()) )||null}
function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=data().speech;const v=selectedVoice();if(v)u.voice=v;u.rate=.82;speechSynthesis.speak(u)}
function clearActive(){document.querySelectorAll(".directory button").forEach(b=>b.classList.remove("active"))}
function render(){const x=data().lessons[active].lines[index];line.textContent=x[0];translation.textContent=x[1]}
function loadLesson(k){active=k;index=0;challenge=-1;discovery=false;solved=false;find.classList.remove("show");actions.style.display="flex";const l=data().lessons[k];title.textContent=l.title;prompt.textContent=l.prompt;render();clearActive();document.querySelector('[data-lesson="'+k+'"]').classList.add("active")}
function loadDiscovery(){challenge=-1;discovery=true;find.classList.remove("show");actions.style.display="none";title.textContent="Click & Discover";prompt.textContent="Click objects anywhere in the scene to learn their names.";line.textContent="";translation.textContent="Click an object in the scene.";clearActive();document.querySelector("[data-discovery]").classList.add("active")}
function loadChallenge(i){challenge=i;discovery=false;solved=false;actions.style.display="none";find.classList.add("show");const key=challengeOrder[i],target=data().words[key];title.textContent="Challenge "+(i+1)+": Find "+englishWords[key]+".";prompt.textContent="Search the scene and click the correct object.";line.textContent=target;translation.textContent=englishWords[key]+".";count.textContent="CHALLENGE "+(i+1)+" OF 6";status.textContent="";hint.textContent="Find the correct object to unlock the next challenge.";challengeNext.textContent=i<5?"Next Challenge →":"Finish Challenges ✓";clearActive();document.querySelector('[data-challenge="'+i+'"]').classList.add("active")}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>loadLesson(b.dataset.lesson));
document.querySelector("[data-discovery]").onclick=loadDiscovery;
document.querySelectorAll("[data-challenge]").forEach(b=>b.onclick=()=>loadChallenge(Number(b.dataset.challenge)));
$("next").onclick=()=>{index=(index+1)%data().lessons[active].lines.length;render()};
$("speak").onclick=()=>speak(data().lessons[active].lines[index][0]);
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{const key=b.dataset.word,target=data().words[key];if(challenge>=0){if(key===challengeOrder[challenge]){solved=true;status.textContent="✓ Nice find! "+target+" "+englishWords[key]+".";status.style.color="#176a48";hint.textContent="Challenge complete. Move to the next one.";speak(target)}else{status.textContent="Not that one — keep looking.";status.style.color="#85580f"}return}if(discovery){title.textContent="Click & Discover";prompt.textContent="You found something in the scene.";line.textContent=target;translation.textContent=englishWords[key]+".";speak(target)}});
challengeNext.onclick=()=>{if(!solved){status.textContent="Find the correct object first.";status.style.color="#85580f";return}if(challenge<5)loadChallenge(challenge+1);else{status.textContent="🏁 You completed all 6 Market challenges!";status.style.color="#176a48";hint.textContent="Great job exploring the market."}};
function applyLanguage(lang){if(!languageData[lang])lang="es";languageSelect.value=lang;localStorage.setItem(LANG_KEY,lang);refreshVoices();if(challenge>=0)loadChallenge(challenge);else if(discovery)loadDiscovery();else loadLesson(active)}
const params=new URLSearchParams(location.search);const incoming=params.get("lang");const saved=localStorage.getItem(LANG_KEY);applyLanguage(languageData[incoming]?incoming:(languageData[saved]?saved:"es"));
languageSelect.addEventListener("change",()=>applyLanguage(languageSelect.value));
voiceSelect.addEventListener("change",()=>localStorage.setItem(VOICE_KEY+currentLang(),voiceSelect.value));
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=refreshVoices;setTimeout(refreshVoices,100)}
})();
</script>
