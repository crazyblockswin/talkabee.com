const lessons={
en:{view:["From space, Earth looks beautiful, but astronauts can also observe clouds, cities, fires, dust, and some forms of pollution.","Seeing our planet from far away reminds us that its air, land, and water are connected."],pollution:["Air pollution happens when harmful gases and particles enter the air.","Pollution can come from many sources, including transportation, industry, fires, and energy production."],factories:["Factories make many useful products, but industrial processes can also release pollution if emissions are not controlled.","Cleaner technology, filters, efficiency, and cleaner energy can reduce harmful emissions."],water:["Pollution on land can reach streams, rivers, lakes, and oceans through runoff and waste.","Keeping trash and harmful chemicals out of waterways helps protect wildlife and clean water."],choices:["People can help by wasting less energy, reusing and recycling materials, preventing litter, and choosing cleaner transportation when practical.","Communities, businesses, scientists, and governments can also work together to reduce pollution."],protect:["Earth is our shared home. Protecting clean air, clean water, soil, forests, and wildlife helps people and nature.","The message of this adventure is simple: do not pollute, and do what you can to leave the planet cleaner."]},
es:{view:["Desde el espacio, la Tierra se ve hermosa, pero los astronautas también pueden observar nubes, ciudades, incendios, polvo y algunas formas de contaminación.","Ver nuestro planeta desde lejos nos recuerda que su aire, tierra y agua están conectados."],pollution:["La contaminación del aire ocurre cuando gases y partículas dañinas entran en el aire.","La contaminación puede provenir de muchas fuentes, como el transporte, la industria, los incendios y la producción de energía."],factories:["Las fábricas producen muchos productos útiles, pero los procesos industriales también pueden liberar contaminación si las emisiones no se controlan.","La tecnología más limpia, los filtros, la eficiencia y la energía más limpia pueden reducir las emisiones dañinas."],water:["La contaminación en tierra puede llegar a arroyos, ríos, lagos y océanos por la escorrentía y los residuos.","Mantener la basura y los productos químicos dañinos fuera del agua ayuda a proteger la vida silvestre y el agua limpia."],choices:["Las personas pueden ayudar usando menos energía, reutilizando y reciclando materiales, evitando tirar basura y eligiendo transporte más limpio cuando sea práctico.","Las comunidades, empresas, científicos y gobiernos también pueden trabajar juntos para reducir la contaminación."],protect:["La Tierra es nuestro hogar compartido. Proteger el aire, el agua, el suelo, los bosques y la vida silvestre ayuda a las personas y a la naturaleza.","El mensaje de esta aventura es sencillo: no contamines y haz lo que puedas para dejar el planeta más limpio."]},
fr:{view:["Depuis l'espace, la Terre est magnifique, mais les astronautes peuvent aussi observer les nuages, les villes, les incendies, la poussière et certaines formes de pollution.","Voir notre planète de loin nous rappelle que son air, ses terres et son eau sont liés."],pollution:["La pollution de l'air se produit lorsque des gaz et des particules nocifs pénètrent dans l'air.","Elle peut provenir de nombreuses sources, notamment les transports, l'industrie, les incendies et la production d'énergie."],factories:["Les usines fabriquent de nombreux produits utiles, mais les procédés industriels peuvent aussi produire de la pollution si les émissions ne sont pas contrôlées.","Des technologies plus propres, des filtres, l'efficacité et une énergie plus propre peuvent réduire les émissions nocives."],water:["La pollution terrestre peut atteindre les ruisseaux, les rivières, les lacs et les océans par le ruissellement et les déchets.","Empêcher les déchets et les produits chimiques nocifs d'entrer dans l'eau aide à protéger la faune et l'eau propre."],choices:["On peut aider en gaspillant moins d'énergie, en réutilisant et recyclant, en évitant les déchets sauvages et en choisissant des transports plus propres lorsque c'est possible.","Les communautés, entreprises, scientifiques et gouvernements peuvent également travailler ensemble pour réduire la pollution."],protect:["La Terre est notre maison commune. Protéger l'air, l'eau, les sols, les forêts et la faune aide les personnes et la nature.","Le message de cette aventure est simple : ne polluons pas et faisons ce que nous pouvons pour laisser une planète plus propre."]},
de:{view:["Aus dem Weltraum sieht die Erde wunderschön aus, doch Astronauten können auch Wolken, Städte, Brände, Staub und manche Formen der Verschmutzung beobachten.","Der Blick aus der Ferne erinnert uns daran, dass Luft, Land und Wasser miteinander verbunden sind."],pollution:["Luftverschmutzung entsteht, wenn schädliche Gase und Partikel in die Luft gelangen.","Verschmutzung kann aus vielen Quellen stammen, darunter Verkehr, Industrie, Brände und Energieerzeugung."],factories:["Fabriken stellen viele nützliche Produkte her, doch industrielle Prozesse können auch Schadstoffe freisetzen, wenn Emissionen nicht kontrolliert werden.","Sauberere Technik, Filter, Effizienz und sauberere Energie können schädliche Emissionen verringern."],water:["Verschmutzung an Land kann durch Abfluss und Abfälle in Bäche, Flüsse, Seen und Ozeane gelangen.","Müll und schädliche Chemikalien von Gewässern fernzuhalten hilft, Tiere und sauberes Wasser zu schützen."],choices:["Menschen können helfen, indem sie weniger Energie verschwenden, Materialien wiederverwenden und recyceln, Müll vermeiden und wenn möglich sauberere Verkehrsmittel wählen.","Gemeinden, Unternehmen, Wissenschaftler und Regierungen können ebenfalls zusammenarbeiten, um Verschmutzung zu reduzieren."],protect:["Die Erde ist unser gemeinsames Zuhause. Saubere Luft, sauberes Wasser, Böden, Wälder und Tiere zu schützen hilft Menschen und Natur.","Die Botschaft dieses Abenteuers ist einfach: nicht verschmutzen und tun, was man kann, um den Planeten sauberer zu hinterlassen."]},
it:{view:["Dallo spazio la Terra appare bellissima, ma gli astronauti possono anche osservare nuvole, città, incendi, polvere e alcune forme di inquinamento.","Vedere il pianeta da lontano ci ricorda che aria, terra e acqua sono collegate."],pollution:["L'inquinamento atmosferico si verifica quando gas e particelle nocive entrano nell'aria.","Può provenire da molte fonti, tra cui trasporti, industria, incendi e produzione di energia."],factories:["Le fabbriche producono molti prodotti utili, ma i processi industriali possono anche rilasciare inquinamento se le emissioni non sono controllate.","Tecnologie più pulite, filtri, efficienza ed energia più pulita possono ridurre le emissioni nocive."],water:["L'inquinamento sulla terra può raggiungere ruscelli, fiumi, laghi e oceani attraverso il deflusso e i rifiuti.","Tenere rifiuti e sostanze chimiche nocive lontano dall'acqua aiuta a proteggere la fauna e l'acqua pulita."],choices:["Le persone possono aiutare sprecando meno energia, riutilizzando e riciclando materiali, evitando di gettare rifiuti e scegliendo trasporti più puliti quando possibile.","Comunità, imprese, scienziati e governi possono inoltre collaborare per ridurre l'inquinamento."],protect:["La Terra è la nostra casa comune. Proteggere aria, acqua, suolo, foreste e fauna aiuta le persone e la natura.","Il messaggio di questa avventura è semplice: non inquinare e fai ciò che puoi per lasciare il pianeta più pulito."]},
pt:{view:["Do espaço, a Terra parece linda, mas astronautas também podem observar nuvens, cidades, incêndios, poeira e algumas formas de poluição.","Ver nosso planeta de longe nos lembra que o ar, a terra e a água estão conectados."],pollution:["A poluição do ar acontece quando gases e partículas prejudiciais entram no ar.","Ela pode vir de muitas fontes, incluindo transporte, indústria, incêndios e produção de energia."],factories:["Fábricas produzem muitos produtos úteis, mas processos industriais também podem liberar poluição se as emissões não forem controladas.","Tecnologia mais limpa, filtros, eficiência e energia mais limpa podem reduzir emissões prejudiciais."],water:["A poluição em terra pode chegar a córregos, rios, lagos e oceanos por escoamento e resíduos.","Manter lixo e produtos químicos prejudiciais longe da água ajuda a proteger a vida selvagem e a água limpa."],choices:["As pessoas podem ajudar desperdiçando menos energia, reutilizando e reciclando materiais, evitando lixo e escolhendo transporte mais limpo quando for prático.","Comunidades, empresas, cientistas e governos também podem trabalhar juntos para reduzir a poluição."],protect:["A Terra é nosso lar compartilhado. Proteger o ar, a água, o solo, as florestas e a vida selvagem ajuda as pessoas e a natureza.","A mensagem desta aventura é simples: não polua e faça o que puder para deixar o planeta mais limpo."]},
no:{view:["Fra verdensrommet ser jorden vakker ut, men astronauter kan også observere skyer, byer, branner, støv og enkelte former for forurensning.","Å se planeten på avstand minner oss om at luft, land og vann henger sammen."],pollution:["Luftforurensning oppstår når skadelige gasser og partikler kommer ut i luften.","Forurensning kan komme fra mange kilder, blant annet transport, industri, branner og energiproduksjon."],factories:["Fabrikker lager mange nyttige produkter, men industrielle prosesser kan også slippe ut forurensning dersom utslipp ikke kontrolleres.","Renere teknologi, filtre, effektivitet og renere energi kan redusere skadelige utslipp."],water:["Forurensning på land kan nå bekker, elver, innsjøer og hav gjennom avrenning og avfall.","Å holde søppel og skadelige kjemikalier unna vann bidrar til å beskytte dyreliv og rent vann."],choices:["Folk kan hjelpe ved å sløse mindre energi, gjenbruke og resirkulere materialer, unngå forsøpling og velge renere transport når det er praktisk.","Lokalsamfunn, bedrifter, forskere og myndigheter kan også samarbeide om å redusere forurensning."],protect:["Jorden er vårt felles hjem. Å beskytte ren luft, rent vann, jord, skog og dyreliv hjelper både mennesker og natur.","Budskapet i dette eventyret er enkelt: ikke forurens, og gjør det du kan for å etterlate planeten renere."]}};

let lastWord="game",activeLesson="",lessonPhrase=1,challenge=-1,lastSpoken="";
function voices(){return ("speechSynthesis" in window)?speechSynthesis.getVoices():[]}
function fillVoices(){const old=localStorage.getItem("talkabee-protect-earth-voice-"+langSel.value)||"";voiceSel.innerHTML='<option value="">Browser Default</option>';voices().forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+(v.lang?" — "+v.lang:"");voiceSel.appendChild(o)});if([...voiceSel.options].some(o=>o.value===old))voiceSel.value=old}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices();setTimeout(fillVoices,150);setTimeout(fillVoices,600);setTimeout(fillVoices,1500)}
voiceSel.onchange=()=>localStorage.setItem("talkabee-protect-earth-voice-"+langSel.value,voiceSel.value);
function speak(text,rate=.88,onend=null){if(!text||!("speechSynthesis" in window)){if(onend)onend();return}speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH_LANG[langSel.value]||langSel.value;u.rate=rate;const v=speechSynthesis.getVoices().find(x=>x.name===voiceSel.value);if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u)},50);lastSpoken=text}
function stopSound(){document.querySelectorAll("audio[data-talkabee-sound]").forEach(a=>{a.pause();a.currentTime=0;a.remove()})}
function playSound(key){stopSound();const src=SOUND_MAP[key];if(!src)return;const a=new Audio(src);a.dataset.talkabeeSound="1";document.body.appendChild(a);a.play().catch(()=>{});a.onended=()=>a.remove()}
function showWord(key){activeLesson="";lastWord=key;lessonPhrase=1;title.textContent="Click & Discover";prompt.textContent="You found "+(EN[key]||key)+".";line.textContent=WORDS[langSel.value][key]||EN[key]||key;translation.textContent=langSel.value==="en"?"":(EN[key]||key)}
document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{const key=b.dataset.word;showWord(key);let played=false;const after=()=>{if(played)return;played=true;playSound(key)};speak(WORDS[langSel.value][key]||EN[key]||key,.82,after);setTimeout(after,1500);if(challenge>=0){if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.color="#9dffbf"}else{status.textContent="Not that one — keep looking.";status.style.color="#ffe28a"}}});
function clearChallenge(){challenge=-1;world.classList.remove("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.remove("target"));status.textContent=""}
document.getElementById("discovery").onclick=()=>{clearChallenge();activeLesson="";lastWord="game";title.textContent="Click & Discover";prompt.textContent="Click any object in the scene to hear its name.";line.textContent=WORDS[langSel.value].game;translation.textContent=langSel.value==="en"?"":EN.game};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{activeLesson="";lastWord="";challenge=+b.dataset.ch;world.classList.add("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^[0-9]+\.\s*/,"");line.textContent=WORDS[langSel.value][challengeOrder[challenge]];translation.textContent=langSel.value==="en"?"":EN[challengeOrder[challenge]];status.textContent=""});
function showLesson(key,speakIt=false){clearChallenge();activeLesson=key;lastWord="";lessonPhrase=Math.max(0,Math.min(1,lessonPhrase));const a=lessons[langSel.value][key],e=lessons.en[key],btn=document.querySelector(`[data-lesson="${key}"]`);title.textContent=btn?btn.textContent.replace(/^[0-9]+\.\s*/,""):"Protect Earth Adventure";prompt.textContent=a[0];line.textContent=a[lessonPhrase];translation.textContent=langSel.value==="en"?"":e[lessonPhrase];if(speakIt)speak(a[lessonPhrase])}
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{lessonPhrase=1;showLesson(b.dataset.lesson,true)});
function currentSpeechText(){if(activeLesson)return lessons[langSel.value][activeLesson][lessonPhrase];if(lastWord)return WORDS[langSel.value][lastWord]||EN[lastWord];return line.textContent}
document.getElementById("normal").onclick=()=>speak(currentSpeechText(),.82);
document.getElementById("slow").onclick=()=>speak(currentSpeechText(),.58);
document.getElementById("replay").onclick=()=>speak(lastSpoken||currentSpeechText(),.82);
document.getElementById("nextPhrase").onclick=()=>{if(!activeLesson){const keys=Object.keys(EN),i=Math.max(0,keys.indexOf(lastWord));showWord(keys[(i+1)%keys.length]);speak(currentSpeechText(),.82);return}lessonPhrase=(lessonPhrase+1)%2;showLesson(activeLesson,true)};
langSel.onchange=()=>{fillVoices();if(activeLesson)showLesson(activeLesson,false);else if(lastWord)showWord(lastWord)};
document.getElementById("sceneView").onclick=()=>document.body.classList.add("scene-view");
document.getElementById("sceneReturn").onclick=()=>document.body.classList.remove("scene-view");
showWord("game");
</script>
</body>
</html>
