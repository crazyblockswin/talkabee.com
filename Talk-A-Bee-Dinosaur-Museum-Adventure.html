let museumSound=null;
function playMuseumSound(id){
 const file=museumSounds[id]; if(!file)return;
 if(museumSound){museumSound.pause();museumSound.currentTime=0;}
 museumSound=new Audio("sounds/"+file); museumSound.play().catch(()=>{});
}
const challengeOrder=["trex","triceratops","stegosaurus","pterosaur","eggs","footprints"];

const title=document.getElementById("title"),prompt=document.getElementById("prompt"),line=document.getElementById("line"),translation=document.getElementById("translation"),status=document.getElementById("status"),world=document.getElementById("world");
let lastWord="trex",challenge=-1,activeLesson="";
function fillVoices(){const vs=speechSynthesis.getVoices();voiceSel.innerHTML='<option>Browser Default</option>'+vs.map(v=>`<option>${v.name}</option>`).join("")}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices()}
function speak(t,rate=.82,onend=null){if(!t||!("speechSynthesis" in window)){if(onend)onend();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[langSel.value].code;u.rate=rate;const v=speechSynthesis.getVoices().find(v=>v.name===voiceSel.value);if(v)u.voice=v;if(onend)u.onend=onend;u.onerror=()=>{if(onend)onend()};setTimeout(()=>speechSynthesis.speak(u),40)}catch(e){if(onend)onend();}}

/* LOCKED TALK A BEE ADVENTURE MASTER — 2026-10-02 */
.panel{box-sizing:border-box!important;left:16px!important;top:16px!important;bottom:auto!important;width:195px!important;min-width:195px!important;max-width:195px!important;height:calc(100vh - 32px)!important;max-height:calc(100vh - 32px)!important;overflow-y:auto!important;overflow-x:hidden!important;padding:12px 14px!important;border-radius:20px!important;background:rgba(7,23,39,.31)!important;border:1px solid rgba(255,255,255,.28)!important;box-shadow:0 10px 28px rgba(0,0,0,.22)!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important;color:#fff!important;scrollbar-width:thin!important;transform:none!important;transform-origin:top left!important}
.panel button,.panel select,.panel a{box-sizing:border-box!important;width:100%!important;margin:4px 0!important;padding:8px 10px!important;min-height:0!important;height:auto!important;border-radius:12px!important;border:1px solid rgba(255,255,255,.38)!important;background:rgba(7,32,50,.54)!important;color:#fff!important;font-size:12px!important;line-height:1.16!important;font-weight:800!important;box-shadow:none!important}
.panel .label,.panel .activity-label,.panel .yacht-label,.panel .train-label{font-size:9.5px!important;line-height:1.2!important;margin:8px 2px 4px!important}
.panel .place,.panel .activity-place,.panel .yacht-place,.panel .train-place,.panel .title{font-size:19px!important;line-height:1.08!important;margin:1px 0 7px!important}
.panel .divider,.panel .activity-divider,.panel .yacht-divider,.panel .train-divider{margin:7px 2px!important}
.card{box-sizing:border-box!important;width:min(650px,48vw)!important;min-width:0!important;max-width:650px!important;height:auto!important;max-height:none!important;padding:14px 18px!important;border-radius:20px!important;background:rgba(7,23,39,.28)!important;border:1px solid rgba(255,255,255,.32)!important;box-shadow:0 10px 28px rgba(0,0,0,.22)!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important;color:#fff!important;overflow:visible!important;transform:none!important}
.card .actions{display:flex!important;flex-wrap:nowrap!important;gap:8px!important;align-items:center!important}
.card .actions button{white-space:nowrap!important;margin:0!important}
@media(max-width:900px){.panel{width:190px!important;min-width:190px!important;max-width:190px!important}.card{width:min(620px,calc(100vw - 220px))!important;max-width:620px!important}.card .actions{flex-wrap:wrap!important}}
</style>
<script id="talkabee-inclusive-browser-voices-v1">
(()=>{
  if(!('speechSynthesis' in window))return;
  const voiceSelects=()=>[...document.querySelectorAll('select')].filter(s=>/voice/i.test((s.id||'')+' '+(s.name||'')+' '+(s.className||'')));
  function fillAllBrowserVoices(){
    const voices=speechSynthesis.getVoices(); if(!voices.length)return;
    voiceSelects().forEach(sel=>{
      const chosen=sel.value;
      sel.innerHTML='';
      const d=document.createElement('option'); d.value=''; d.textContent='Browser Default'; sel.appendChild(d);
      voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+(v.lang?' — '+v.lang:'');sel.appendChild(o)});
      if([...sel.options].some(o=>o.value===chosen))sel.value=chosen;
    });
  }
  speechSynthesis.addEventListener?.('voiceschanged',fillAllBrowserVoices);
  window.addEventListener('load',()=>{fillAllBrowserVoices();setTimeout(fillAllBrowserVoices,150);setTimeout(fillAllBrowserVoices,600);setTimeout(fillAllBrowserVoices,1500)});
  document.addEventListener('change',e=>{if(e.target&&e.target.tagName==='SELECT'&&!/voice/i.test((e.target.id||'')+' '+(e.target.name||'')+' '+(e.target.className||'')))setTimeout(fillAllBrowserVoices,0)},true);
})();
</script>
</body></html>
