/* --- Talk A Bee guided word-by-word reading --- */
.guided-reading{
  margin:14px 0 8px;
  padding:14px 14px 16px;
  border:1px solid #ded8ef;
  border-radius:15px;
  background:linear-gradient(180deg,#ffffff,#faf8ff);
  box-shadow:0 8px 20px rgba(80,60,130,.05);
}
.guided-reading-label{
  font-size:10px;
  font-weight:950;
  letter-spacing:.08em;
  color:#6d4ddb;
  margin-bottom:9px;
}
.guided-sentence{
  display:flex;
  flex-wrap:wrap;
  gap:7px 8px;
  align-items:flex-end;
  line-height:1.9;
  min-height:48px;
}
.guided-word{
  position:relative;
  display:inline-block;
  padding:2px 4px 3px;
  border-radius:7px;
  transition:background .14s ease,color .14s ease,transform .14s ease,box-shadow .14s ease;
  font-size:20px;
  font-weight:850;
  color:#26334a;
}
.guided-word.active{
  color:#4f32bf;
  background:#eee8ff;
  transform:translateY(-1px);
  box-shadow:0 0 0 2px rgba(117,82,232,.10),0 4px 10px rgba(93,63,211,.12);
}
.guided-word.active::before{
  content:"";
  position:absolute;
  width:9px;height:9px;
  border-radius:50%;
  background:#ff9e55;
  left:50%;
  top:-11px;
  transform:translateX(-50%);
  box-shadow:0 2px 7px rgba(255,133,55,.35);
  animation:lingoBounce .48s ease-in-out infinite alternate;
}
.guided-word.done{
  color:#21835d;
}
@keyframes lingoBounce{
  from{transform:translate(-50%,0)}
  to{transform:translate(-50%,-5px)}
}
.guided-translation{
  margin-top:8px;
  color:#6c7890;
  font-size:13px;
}
.guided-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}
.guided-actions button{
  border:1px solid #ddd7ee;
  background:white;
  border-radius:9px;
  padding:7px 9px;
  font-weight:850;
  color:#413a59;
}
.speaker-glow{
  box-shadow:0 0 0 3px rgba(117,82,232,.20),0 0 22px rgba(117,82,232,.22)!important;
}

   $('yachtList').innerHTML='';items.forEach((row,i)=>{const b=document.createElement('button');b.type='button';b.className=i===index?'active':'';b.innerHTML='<strong>'+(i+1)+'. '+row[0]+'</strong><br><span style="font-size:12px;color:#737c91">'+row[1]+'</span>';b.onclick=()=>{index=i;render()};$('yachtList').appendChild(b)});
 }
 world.querySelectorAll('.yacht-nav').forEach(btn=>btn.addEventListener('click',()=>{world.querySelectorAll('.yacht-nav').forEach(b=>b.classList.remove('active'));btn.classList.add('active');group=btn.dataset.yachtGroup;index=0;render()}));
 world.querySelectorAll('.yacht-challenge-nav').forEach(btn=>btn.addEventListener('click',()=>{challengeIndex=Number(btn.dataset.yachtChallenge)||0;group='find';world.querySelectorAll('.yacht-nav').forEach(b=>b.classList.remove('active'));render()}));

 function speakYachtAuto(key,text){
   if(!('speechSynthesis' in window)||!text){playYachtSceneSound(key);return}
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(text);
   u.lang=locale[currentLang()]||'en-US';u.rate=.78;
   const wanted=$('seaVoice')?.value;
   if(wanted){const v=speechSynthesis.getVoices().find(x=>x.name===wanted);if(v)u.voice=v}
   u.onend=()=>playYachtSceneSound(key);
   u.onerror=()=>playYachtSceneSound(key);
   speechSynthesis.speak(u);
 }

 const hotspotLayer=$('yachtHotspots');
 hotspotLayer.querySelectorAll('.yacht-hotspot').forEach(btn=>btn.replaceWith(btn.cloneNode(true)));
 hotspotLayer.addEventListener('click',e=>{
   const btn=e.target.closest('.yacht-hotspot');if(!btn||!hotspotLayer.contains(btn))return;
   e.preventDefault();e.stopPropagation();
   const key=btn.dataset.object;
   if(!english[key])return;
   const target=currentWord(key);
   if(group==='find'){
     const wanted=challengeOrder[challengeIndex];
     if(key===wanted){solved=true;$('yachtFindStatus').textContent='✓ Nice find! '+target+' means '+english[key]+'.';$('yachtFindStatus').style.color='#19744f';$('yachtNextHint').textContent='Challenge complete. You can move to the next one.';speakYachtAuto(key,target)}
     else{$('yachtFindStatus').textContent='Not that one — keep looking.';$('yachtFindStatus').style.color='#8b5b13'}
     return;
   }
   $('yachtKicker').textContent='CLICK & DISCOVER';$('yachtTitle').textContent=target;$('yachtPrompt').textContent=english[key];$('yachtTranslation').textContent=target+' — '+english[key];speakYachtAuto(key,target);
 },true);

 $('yachtChallengeNext').addEventListener('click',()=>{if(!solved){$('yachtFindStatus').textContent='Find the correct one first.';$('yachtFindStatus').style.color='#8b5b13';return}if(challengeIndex<5){challengeIndex++;render()}else{$('yachtFindStatus').textContent='🏁 You completed all 6 Sea Adventures challenges!';$('yachtFindStatus').style.color='#19744f'}});
 $('yachtPlay').addEventListener('click',()=>{const item=currentItems()[index]||currentItems()[0];speak(item[0],.86)});
 $('yachtSlow').addEventListener('click',()=>{const item=currentItems()[index]||currentItems()[0];speak(item[0],.58)});
 $('yachtReplay').addEventListener('click',()=>speak(lastText||((currentItems()[index]||currentItems()[0])[0]),lastRate));
 $('yachtNextPhrase').addEventListener('click',()=>{const items=currentItems();index=(index+1)%items.length;render()});
 $('yachtPeek').addEventListener('click',()=>world.classList.add('activity-collapsed'));
 $('yachtRestore').addEventListener('click',()=>world.classList.remove('activity-collapsed'));

 $('seaLanguage').value=localStorage.getItem('talkabee-learn-language')||'es';
 $('seaLanguage').addEventListener('change',()=>{localStorage.setItem('talkabee-learn-language',currentLang());index=0;populateVoices();render()});
 $('seaVoice').addEventListener('change',()=>localStorage.setItem('talkabee-sea-voice-'+currentLang(),$('seaVoice').value));
 if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=populateVoices;populateVoices()}
 render();
});
</script>
<script id="sea-standalone-launch">
window.addEventListener('load',function(){
 const main=document.getElementById('mainDirectory'),world=document.getElementById('yachtWorld');
 if(main)main.style.display='none';
 if(world){world.classList.add('open');world.classList.remove('activity-collapsed');}
 document.body.classList.add('talkabee-world-open','sea-adventures-open');
 window.scrollTo(0,0);
});
</script>
<script id="sea-return-hard-lock">
document.addEventListener('click',function(e){
  const b=e.target.closest('#yachtMainDirectory');
  if(!b)return;
  e.preventDefault();
  e.stopImmediatePropagation();
  window.location.href='index.html';
},true);
</script>
</body>
</html>
