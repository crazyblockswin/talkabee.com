<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talk A Bee — Numbers</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#fff6e8;background:radial-gradient(ellipse at 75% 10%,#477ca3 0,transparent 45%),linear-gradient(145deg,#142b45,#153b53 48%,#244c5b);min-height:100vh}a{color:inherit;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;padding:8px 22px;background:#0a2036c4;border-bottom:1px solid #ffffff44;gap:15px;flex-wrap:wrap}.brand{display:flex;align-items:center;font-size:26px;font-weight:bold;gap:8px}.brand img{width:55px;height:55px;object-fit:contain}nav{display:flex;gap:5px;flex-wrap:wrap}nav a{font-size:12px;border:1px solid #ffffff55;border-radius:20px;padding:7px 9px;background:#ffffff17}nav a[aria-current=page]{background:#e5bd67;color:#18283c;font-weight:bold}main{max-width:1170px;margin:auto;padding:16px}.heading{text-align:center;margin-bottom:15px}.heading h1{font-size:30px;margin:5px}.heading p{font-size:14px;margin:3px;color:#e0e9ef}.settings{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0 20px}.settings label{display:flex;gap:6px;align-items:center;font-size:13px}select{font:inherit;border:1px solid #ffffff88;border-radius:9px;padding:7px;background:#f9f5ec;color:#172b3c;max-width:190px}.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}.item{min-height:135px;border:2px solid #000;background:radial-gradient(ellipse at 48% 35%,#303030 0%,#202020 48%,#101010 82%,#050505 100%);border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;padding:10px;cursor:pointer;font:inherit;box-shadow:inset 0 2px 2px #ffffff24,inset 0 -5px 10px #000b,0 5px 0 #050505,0 9px 15px #0006;text-shadow:0 2px 3px #0009;transition:background .15s,transform .15s,box-shadow .15s}.item:hover,.item:focus </style></head><body><header><a class="brand" href="Talk-A-Bee-Main-Directory.html"><img src="images/miss-teacher-bee.png" alt="Talk A Bee mascot">Talk A Bee</a><nav aria-label="Directories"><a href="Talk-A-Bee-Main-Directory.html">Main Directory</a><a href="numbers.html" aria-current="page">Numbers</a><a href="picture-learning.html">Pictures</a><a href="time-calendar.html">Time</a><a href="colors-shapes.html">Colors</a><a href="feelings-expressions.html">Feelings</a><a href="master/adventure.html">Adventures</a></nav></header><main><div class="heading"><h1>Numbers</h1><p>Learn to Count</p></div><div class="settings"><label>Native language <select id="native"></select></label><label>Learning language <select id="learn"></select></label><label>Voice <select id="voice"></select></label></div><nav class="tab-section-nav" aria-label="Learning section navigation"><a href="master/adventure.html" title="Adventures">‹ Previous: Adventures</a><a href="picture-learning.html" title="Pictures">Next: Pictures ›</a></nav><section class="tiles" id="items" aria-label="Numbers items"></section><p class="note">Click any tile to see both languages and hear the learning-language word. Speech availability depends on voices installed in your browser.</p></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Word translation"><div class="popup"><button class="x" id="close" aria-label="Close">×</button><div class="lang" id="nativeLabel"></div><div class="word" id="nativeWord"></div><div class="lang" id="learnLabel"></div><div class="word" id="learnWord"></div><button id="speak">🔊 Speak</button><button id="slow">🐢 Slow</button></div></div><script>const DATA=[{"icon": "1", "words": ["One", "Uno", "Un", "Eins", "Uno", "Um", "Én", "Ένα"]}, {"icon": "2", "words": ["Two", "Dos", "Deux", "Zwei", "Due", "Dois", "To", "Δύο"]}, {"icon": "3", "words": ["Three", "Tres", "Trois", "Drei", "Tre", "Três", "Tre", "Τρία"]}, {"icon": "4", "words": ["Four", "Cuatro", "Quatre", "Vier", "Quattro", "Quatro", "Fire", "Τέσσερα"]}, {"icon": "5", "words": ["Five", "Cinco", "Cinq", "Fünf", "Cinque", "Cinco", "Fem", "Πέντε"]}, {"icon": "6", "words": ["Six", "Seis", "Six", "Sechs", "Sei", "Seis", "Seks", "Έξι"]}, {"icon": "7", "words": ["Seven", "Siete", "Sept", "Sieben", "Sette", "Sete", "Sju", "Επτά"]}, {"icon": "8", "words": ["Eight", "Ocho", "Huit", "Acht", "Otto", "Oito", "Åtte", "Οκτώ"]}, {"icon": "9", "words": ["Nine", "Nueve", "Neuf", "Neun", "Nove", "Nove", "Ni", "Εννέα"]}, {"icon": "10", "words": ["Ten", "Diez", "Dix", "Zehn", "Dieci", "Dez", "Ti", "Δέκα"]}, {"icon": "11", "words": ["Eleven", "Once", "Onze", "Elf", "Undici", "Onze", "Elleve", "Έντεκα"]}, {"icon": "12", "words": ["Twelve", "Doce", "Douze", "Zwölf", "Dodici", "Doze", "Tolv", "Δώδεκα"]}, {"icon": "13", "words": ["Thirteen", "Trece", "Treize", "Dreizehn", "Tredici", "Treze", "Tretten", "Δεκατρία"]}, {"icon": "14", "words": ["Fourteen", "Catorce", "Quatorze", "Vierzehn", "Quattordici", "Catorze", "Fjorten", "Δεκατέσσερα"]}, {"icon": "15", "words": ["Fifteen", "Quince", "Quinze", "Fünfzehn", "Quindici", "Quinze", "Femten", "Δεκαπέντε"]}, {"icon": "16", "words": ["Sixteen", "Dieciséis", "Seize", "Sechzehn", "Sedici", "Dezesseis", "Seksten", "Δεκαέξι"]}, {"icon": "17", "words": ["Seventeen", "Diecisiete", "Dix-sept", "Siebzehn", "Diciassette", "Dezessete", "Sytten", "Δεκαεπτά"]}, {"icon": "18", "words": ["Eighteen", "Dieciocho", "Dix-huit", "Achtzehn", "Diciotto", "Dezoito", "Atten", "Δεκαοκτώ"]}, {"icon": "19", "words": ["Nineteen", "Diecinueve", "Dix-neuf", "Neunzehn", "Diciannove", "Dezenove", "Nitten", "Δεκαεννέα"]}, {"icon": "20", "words": ["Twenty", "Veinte", "Vingt", "Zwanzig", "Venti", "Vinte", "Tjue", "Είκοσι"]}];const LANGS={en:'English',es:'Spanish',fr:'French',de:'German',it:'Italian',pt:'Portuguese',no:'Norwegian'};
const $=id=>document.getElementById(id);let active=null;
function getSaved(keys,fallback){for(const k of keys){let v=localStorage.getItem(k);if(v&&Object.prototype.hasOwnProperty.call(LANGS,v))return v;}return fallback}
const learn=$('learn'),native=$('native'),voice=$('voice');
for(const [code,name] of Object.entries(LANGS)){for(const sel of [learn,native]){const o=document.createElement('option');o.value=code;o.textContent=name;sel.append(o)}}
learn.value=getSaved(['talkabee-learn-language'],'es');native.value=getSaved(['talkabee-native-language','talkabee-preferred-language'],'en');
learn.addEventListener('change',()=>{localStorage.setItem('talkabee-learn-language',learn.value);render()});native.addEventListener('change',()=>{localStorage.setItem('talkabee-native-language',native.value);render()});
let available=[];function voices(){available=speechSynthesis.getVoices();voice.innerHTML='';let filtered=available.filter(v=>v.lang.toLowerCase().startsWith(learn.value==='no'?'nb':learn.value));if(learn.value==='no')filtered=available.filter(v=>/^n[bo]/i.test(v.lang));for(const v of filtered){const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';voice.append(o)}let saved=localStorage.getItem('talkabee-voice-'+learn.value);if(saved&&[...voice.options].some(o=>o.value===saved))voice.value=saved; if(!filtered.length){const o=document.createElement('option');o.textContent='Browser default voice';o.value='';voice.append(o)}}
voice.addEventListener('change',()=>localStorage.setItem('talkabee-voice-'+learn.value,voice.value));learn.addEventListener('change',voices);if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=voices;voices()}
function word(item,code){const index=['en','es','fr','de','it','pt','no'].indexOf(code);return item.words[index]||item.words[0]}
function render(){const grid=$('items');grid.innerHTML='';DATA.forEach((item,i)=>{let b=document.createElement('button');b.className='item';b.type='button';b.innerHTML='<span class="art" aria-hidden="true"></span><span class="name"></span>';b.querySelector('.art').textContent=item.icon;b.querySelector('.name').textContent=word(item,learn.value);b.addEventListener('click',()=>show(i));grid.append(b)})}
function show(i){active=DATA[i];$('nativeLabel').textContent=LANGS[native.value].toUpperCase();$('learnLabel').textContent=LANGS[learn.value].toUpperCase();$('nativeWord').textContent=word(active,native.value);$('learnWord').textContent=word(active,learn.value);$('overlay').classList.add('open');$('close').focus();speak(false)}
function close(){if('speechSynthesis'in window)speechSynthesis.cancel();$('overlay').classList.remove('open');active=null}
function speak(slow){if(!active||!('speechSynthesis'in window))return;speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(word(active,learn.value));utter.lang=({no:'nb-NO',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',pt:'pt-PT'})[learn.value];utter.rate=slow?.75:1;const v=available.find(v=>v.voiceURI===voice.value);if(v)utter.voice=v;speechSynthesis.speak(utter)}
$('close').addEventListener('click',close);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('speak').addEventListener('click',()=>speak(false));$('slow').addEventListener('click',()=>speak(true));render();</script></body></html>
