<script>
(function(){

 const sceneSoundUrls={
   rv:'sounds/RV2-nature.mp3',
   stream:'sounds/creek.mp3',
   waterfall:'sounds/creek.mp3',
   pond:'sounds/creek.mp3',
   bee:'sounds/bee.mp3',
   trees:'sounds/birds-forest.mp3',
   birdhouse:'sounds/birds-forest.mp3',
   birdfeeder:'sounds/birds-forest.mp3',
   bird:'sounds/birds-forest.mp3'
    ,girl:'sounds/girl-laugh.mp3'
    ,redbird:'sounds/bird.mp3'
 };
 let currentSceneSound=null;
 function playSceneSound(key){
   const url=sceneSoundUrls[key];
   if(!url)return;
   if(currentSceneSound){currentSceneSound.pause();currentSceneSound.currentTime=0}
   currentSceneSound=new Audio(url);
   currentSceneSound.volume=.82;
   currentSceneSound.play().catch(()=>{});
 }

 const languageData={
  es:{speech:'es-ES',groups:{
   family:{kicker:'CHARLA FAMILIAR',title:'Conoce a la abuela Cathy y al abuelo Wally.',prompt:'Escucha una frase familiar y luego toca las palabras una por una.',items:[['Esta es mi abuela.','This is my grandmother.'],['Este es mi abuelo.','This is my grandfather.'],['Mi abuela está en el jardín.','My grandmother is in the garden.'],['Mi abuelo alimenta a los pájaros.','My grandfather feeds the birds.']]},
   garden:{kicker:'PALABRAS DEL JARDÍN',title:'Mira alrededor del jardín.',prompt:'La escena te da pistas visuales mientras practicas.',items:[['Hay flores en el jardín.','There are flowers in the garden.'],['Las flores son hermosas.','The flowers are beautiful.'],['La cesta tiene flores.','The basket has flowers.'],['El jardín está lleno de color.','The garden is full of color.']]},
   birds:{kicker:'PÁJAROS',title:'Observa los pájaros.',prompt:'Practica frases cortas sobre lo que puedes ver.',items:[['El pájaro está cerca de la casita.','The bird is near the birdhouse.'],['Hay pájaros en el jardín.','There are birds in the garden.'],['El pájaro es azul.','The bird is blue.'],['Mi abuelo alimenta a los pájaros.','My grandfather feeds the birds.']]},
   hobbies:{kicker:'PASATIEMPOS Y HOGAR',title:'Habla de cosas cotidianas.',prompt:'Usa objetos conocidos de la escena para recordar las palabras.',items:[['A mi abuelo le gusta pescar.','My grandfather likes to fish.'],['Mi abuela cuida las flores.','My grandmother takes care of the flowers.'],['Tenemos una casa rodante.','We have an RV.'],['La maleta está junto al banco.','The suitcase is next to the bench.']]},
   yard:{kicker:'ALREDEDOR DEL PATIO',title:'Explora el patio.',prompt:'Describe lugares y objetos de la escena.',items:[['El perro está junto al estanque.','The dog is beside the pond.'],['La casa rodante está cerca de la casa.','The RV is near the house.'],['La casita para pájaros está en el jardín.','The birdhouse is in the garden.'],['La caña de pescar está lista.','The fishing pole is ready.']]},
   everyday:{kicker:'VIDA COTIDIANA',title:'Practica frases de todos los días.',prompt:'Usa frases sencillas que encajan con la vida en casa.',items:[['Estamos en casa.','We are at home.'],['Hace un día bonito.','It is a beautiful day.'],['Vamos al jardín.','We are going to the garden.'],['Pasamos tiempo con la familia.','We spend time with family.']]}
  },objects:{
   fishing:['la caña de pescar','fishing pole'],birdhouse:['la casita para pájaros','birdhouse'],pond:['el estanque','pond'],dog:['el perro','dog'],rv:['la casa rodante','RV'],bird:['el pájaro','bird']
  }},
  fr:{speech:'fr-FR',groups:{
   family:{kicker:'EN FAMILLE',title:'Voici grand-mère Cathy et grand-père Wally.',prompt:'Écoute une phrase sur la famille, puis touche les mots un par un.',items:[['Voici ma grand-mère.','This is my grandmother.'],['Voici mon grand-père.','This is my grandfather.'],['Ma grand-mère est dans le jardin.','My grandmother is in the garden.'],['Mon grand-père nourrit les oiseaux.','My grandfather feeds the birds.']]},
   garden:{kicker:'MOTS DU JARDIN',title:'Regarde autour du jardin.',prompt:'La scène te donne des indices visuels pendant que tu pratiques.',items:[['Il y a des fleurs dans le jardin.','There are flowers in the garden.'],['Les fleurs sont belles.','The flowers are beautiful.'],['Le panier contient des fleurs.','The basket has flowers.'],['Le jardin est plein de couleurs.','The garden is full of color.']]},
   birds:{kicker:'OISEAUX',title:'Observe les oiseaux.',prompt:'Pratique de courtes phrases sur ce que tu vois.',items:[["L'oiseau est près de la cabane à oiseaux.",'The bird is near the birdhouse.'],['Il y a des oiseaux dans le jardin.','There are birds in the garden.'],["L'oiseau est bleu.",'The bird is blue.'],['Mon grand-père nourrit les oiseaux.','My grandfather feeds the birds.']]},
   hobbies:{kicker:'LOISIRS ET MAISON',title:'Parle des choses de tous les jours.',prompt:'Utilise les objets familiers de la scène pour retenir les mots.',items:[['Mon grand-père aime pêcher.','My grandfather likes to fish.'],["Ma grand-mère s'occupe des fleurs.",'My grandmother takes care of the flowers.'],['Nous avons un camping-car.','We have an RV.'],['La valise est près du banc.','The suitcase is next to the bench.']]},
   yard:{kicker:'DANS LE JARDIN',title:'Explore le jardin.',prompt:'Décris les endroits et les objets de la scène.',items:[["Le chien est près de l'étang.",'The dog is beside the pond.'],['Le camping-car est près de la maison.','The RV is near the house.'],['La cabane à oiseaux est dans le jardin.','The birdhouse is in the garden.'],['La canne à pêche est prête.','The fishing pole is ready.']]},
   everyday:{kicker:'VIE QUOTIDIENNE',title:'Pratique des phrases de tous les jours.',prompt:'Utilise des phrases simples qui correspondent à la vie à la maison.',items:[['Nous sommes à la maison.','We are at home.'],["C'est une belle journée.",'It is a beautiful day.'],['Nous allons dans le jardin.','We are going to the garden.'],['Nous passons du temps en famille.','We spend time with family.']]}

 function say(text,rate=.86,highlight=false){
   if(!('speechSynthesis'in window)||!text)return;
   speechSynthesis.cancel();lastRate=rate;
   const u=new SpeechSynthesisUtterance(text);u.lang=lang().speech;u.rate=rate;
   const v=selectedVoice();if(v)u.voice=v;
   const words=[...wordline.querySelectorAll('.home-word')];
   if(highlight){
     words.forEach(w=>w.classList.remove('speaking'));let i=0;
     const fallback=setInterval(()=>{words.forEach((w,j)=>w.classList.toggle('speaking',j===i));i++;if(i>=words.length){clearInterval(fallback);setTimeout(()=>words.forEach(w=>w.classList.remove('speaking')),350)}},Math.max(320,Math.round(650/rate)));
   }
   speechSynthesis.speak(u);
 }

 function speakDiscoveryObject(key){
   const o=obj(key),audio=characterAudio[key];

     if('speechSynthesis' in window)speechSynthesis.cancel();
     Object.values(characterAudio).forEach(a=>{a.pause();a.currentTime=0});

     return;

 function sayDiscovery(text){
   if(!('speechSynthesis' in window)||!text)return;
   const langCode=lang().speech;
   const chosen=selectedVoice();
   speechSynthesis.cancel();
   window.setTimeout(()=>{
     const u=new SpeechSynthesisUtterance(text);
     u.lang=langCode;u.rate=.78;
     if(chosen)u.voice=chosen;
     speechSynthesis.speak(u);
   },60);
 }

   if(homeChallengeIndex<5)openHomeChallenge(homeChallengeIndex+1);
   else{status.textContent='🏁 You completed all 6 challenges!';status.style.color='#19744f';const finishBtn=document.getElementById('homeChallengeNext');finishBtn.textContent='Challenges Complete ✓';if(hint)hint.textContent='All six challenges complete!'}
 });

 document.querySelectorAll('.home-hotspot').forEach(btn=>btn.addEventListener('click',()=>{
   const key=btn.dataset.object;
   playSceneSound(key);
   const o=obj(key);
   if(group==='find'){
     const status=document.getElementById('homeFindStatus');
     if(key===findTarget){homeChallengeSolved=true;status.textContent='✓ Correct! '+o.word;status.style.color='#19744f';say(o.word,.72,false);const nav=document.querySelector('.home-challenge-nav[data-home-challenge="'+homeChallengeIndex+'"]');if(nav)nav.classList.add('done');const hint=document.getElementById('challengeNextHint');if(hint)hint.textContent='Nice work! Continue when you are ready.'}
     else{status.textContent='Try another object.';status.style.color='#a2483d'}return;
   }
   if(group!=='discover')return;
   currentObjectKey=key;document.getElementById('homePopWord').textContent=o.word;document.getElementById('homePopEnglish').textContent=o.english;
   document.getElementById('homePopSentence').textContent='';document.getElementById('homePopSentenceSpeak').style.display='none';
   pop.classList.add('show');speakDiscoveryObject(key);
 }));
 document.getElementById('homePopWordSpeak').addEventListener('click',()=>{if(currentObjectKey)speakDiscoveryObject(currentObjectKey)});
 document.getElementById('homePopSentenceSpeak').addEventListener('click',()=>{});

 languageSelect.addEventListener('change',()=>{
   localStorage.setItem('talkabee-learn-language',languageSelect.value);index=0;refreshVoices();render();
   if(group==='discover')pop.classList.remove('show');
 });
 voiceSelect.addEventListener('change',()=>localStorage.setItem('talkabee-home-voice-'+languageSelect.value,voiceSelect.value));
 const savedLang=localStorage.getItem('talkabee-learn-language');
 if(savedLang&&languageData[savedLang])languageSelect.value=savedLang;
 refreshVoices();
 if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=refreshVoices;
 render();
})();
</script>
</body>
</html>
