<!-- Talk A Bee global browser-voice bridge -->
<script>
(function(){
  const GLOBAL_PREFIX='talkabee-voice-';
  function controls(){
    const selects=[...document.querySelectorAll('select')];
    const voice=selects.find(s=>/voice/i.test((s.id||'')+' '+(s.name||'')+' '+(s.getAttribute('aria-label')||'')));
    const language=selects.find(s=>/lang/i.test((s.id||'')+' '+(s.name||'')+' '+(s.getAttribute('aria-label')||'')));
    return {language,voice};
  }
  function voices(){return ('speechSynthesis' in window)?(speechSynthesis.getVoices()||[]):[];}
  function key(lang){return GLOBAL_PREFIX+lang;}
  function selectedVoiceURI(sel){
    if(!sel||!sel.value)return '';
    const vs=voices(), opt=sel.options[sel.selectedIndex];
    const raw=sel.value, label=(opt&&opt.textContent)||'';
    let v=vs.find(x=>x.voiceURI===raw)||vs.find(x=>x.name===raw);
    if(!v && label) v=vs.find(x=>label===x.name||label.startsWith(x.name+' —')||label.startsWith(x.name+' -'));
    return v?v.voiceURI:'';
  }
  function restore(){
    const {language,voice}=controls(); if(!language||!voice)return;
    const saved=localStorage.getItem(key(language.value))||''; if(!saved)return;
    const vs=voices(), target=vs.find(v=>v.voiceURI===saved); if(!target)return;
    const opts=[...voice.options];
    let opt=opts.find(o=>o.value===target.voiceURI)||opts.find(o=>o.value===target.name)||
            opts.find(o=>o.textContent===target.name||o.textContent.startsWith(target.name+' —')||o.textContent.startsWith(target.name+' -'));
    if(opt && voice.value!==opt.value){
      voice.value=opt.value;
      voice.dispatchEvent(new Event('change',{bubbles:true}));
    }
  }
  function save(){
    const {language,voice}=controls(); if(!language||!voice)return;
    const uri=selectedVoiceURI(voice);
    localStorage.setItem(key(language.value),uri);
  }
  function restoreLanguage(){
    const {language}=controls(); if(!language)return;
    const saved=localStorage.getItem('talkabee-learn-language')||'';
    if(saved && [...language.options].some(o=>o.value===saved) && language.value!==saved){
      language.value=saved;
      language.dispatchEvent(new Event('change',{bubbles:true}));
    }
  }
  function saveLanguage(){
    const {language}=controls(); if(language) localStorage.setItem('talkabee-learn-language',language.value);
  }
  function bind(){
    const {language,voice}=controls(); if(!language||!voice)return;
    if(!voice.dataset.tabGlobalVoice){ voice.addEventListener('change',save); voice.dataset.tabGlobalVoice='1'; }
    if(!language.dataset.tabGlobalVoice){
      language.addEventListener('change',()=>{saveLanguage();setTimeout(restore,0);setTimeout(restore,120);setTimeout(restore,500)});
      language.dataset.tabGlobalVoice='1';
    }
    restoreLanguage(); restore(); setTimeout(restore,120); setTimeout(restore,500); setTimeout(restore,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
  if('speechSynthesis' in window){
    const prior=speechSynthesis.onvoiceschanged;
    speechSynthesis.onvoiceschanged=function(e){if(typeof prior==='function')prior.call(this,e);setTimeout(bind,0);setTimeout(restore,120)};
  }
})();
</script>
<script id="talkabee-accessibility-controls-script-v1">
(function(){
 const panel=document.querySelector('.tab-master-panel,.activity-panel,.panel');
 if(panel){
  const minus=panel.querySelector('.tab-panel-minus'),plus=panel.querySelector('.tab-panel-plus'),reset=panel.querySelector('.tab-panel-reset');
  const KEY='talkabee-global-activity-panel-size',DEFAULT=195,MIN=170,MAX=310,STEP=20;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const apply=(width,save=true)=>{width=clamp(Math.round(Number(width)||DEFAULT),MIN,MAX);const scale=clamp(width/DEFAULT,.88,1.42);panel.style.setProperty('width',width+'px','important');panel.style.setProperty('min-width',width+'px','important');panel.style.setProperty('max-width',width+'px','important');panel.style.setProperty('--tab-panel-scale',scale.toFixed(3));if(save)try{localStorage.setItem(KEY,String(width))}catch(e){}};
  const current=()=>panel.getBoundingClientRect().width||DEFAULT;
  if(minus)minus.addEventListener('click',()=>apply(current()-STEP));
  if(plus)plus.addEventListener('click',()=>apply(current()+STEP));
  if(reset)reset.addEventListener('click',()=>{apply(DEFAULT,false);try{localStorage.removeItem(KEY)}catch(e){}});
  try{const saved=localStorage.getItem(KEY);if(saved)apply(saved,false)}catch(e){}
 }

 const card=document.querySelector('.tab-master-card,.script,.card');
 if(!card)return;
 const drag=card.querySelector('.tab-card-drag'),down=card.querySelector('.tab-card-font-down'),up=card.querySelector('.tab-card-font-up'),reset=card.querySelector('.tab-card-reset'),resize=card.querySelector('.tab-card-resize');
 const PK='talkabee-global-script-card-position',SK='talkabee-global-script-card-scale',FK='talkabee-global-script-card-font-scale';
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 const defaultScale=()=>matchMedia('(max-width:760px)').matches?.82:.67;
 let scale=defaultScale(),fontScale=1,dragState=null;

 function applyTransform(){
   if(card.dataset.moved==='1'){
     card.style.setProperty('transform-origin','top left','important');
     card.style.setProperty('transform','scale('+scale+')','important');
   }else{
     card.style.removeProperty('transform-origin');
     card.style.removeProperty('transform');
   }
 }
 function applyFont(v,save=true){
   fontScale=clamp(Number(v)||1,.75,1.6);
   card.style.setProperty('--tab-card-font-scale',fontScale.toFixed(2));
   if(save)try{localStorage.setItem(FK,String(fontScale))}catch(e){}
 }
 function saveState(){
   try{
     localStorage.setItem(SK,String(scale));
     if(card.dataset.moved==='1'){
       localStorage.setItem(PK,JSON.stringify({left:parseFloat(card.style.left)||card.getBoundingClientRect().left,top:parseFloat(card.style.top)||card.getBoundingClientRect().top}));
     }
   }catch(e){}
 }
 function restore(){
   try{
     const fs=localStorage.getItem(FK); if(fs)applyFont(fs,false);
     const ss=parseFloat(localStorage.getItem(SK)); if(ss)scale=clamp(ss,.45,1.10);
     const ps=JSON.parse(localStorage.getItem(PK)||'null');
     if(ps&&innerWidth>760){
       card.dataset.moved='1';
       card.style.setProperty('left',clamp(ps.left,8,innerWidth-80)+'px','important');
       card.style.setProperty('top',clamp(ps.top,8,innerHeight-80)+'px','important');
       card.style.setProperty('right','auto','important');
       card.style.setProperty('bottom','auto','important');
       applyTransform();
     }
   }catch(e){}
 }

 if(down)down.addEventListener('click',()=>{scale=clamp(+(scale-.05).toFixed(2),.45,1.10);applyTransform();saveState()});
 if(up)up.addEventListener('click',()=>{scale=clamp(+(scale+.05).toFixed(2),.45,1.10);applyTransform();saveState()});

 if(reset)reset.addEventListener('click',()=>{
   try{localStorage.removeItem(PK);localStorage.removeItem(SK);localStorage.removeItem(FK)}catch(e){}
   scale=defaultScale();fontScale=1;
   delete card.dataset.moved;
   ['width','height','left','top','right','bottom','transform','transform-origin','min-width','max-width','min-height','max-height'].forEach(p=>card.style.removeProperty(p));
   applyFont(1,false);
 });

 function startDrag(e){
   if(innerWidth<=760 || (typeof e.button==='number'&&e.button!==0))return;
   if(e.target.closest('.tab-card-resize,.tab-card-font-down,.tab-card-font-up,.tab-card-reset,a,input,select,textarea'))return;
   if(e.target.closest('button') && !e.target.closest('.tab-card-drag'))return;
   e.preventDefault();
   const r=card.getBoundingClientRect();
   // Convert the visual top-left to fixed coordinates, while keeping the exact current scale.
   card.dataset.moved='1';
   card.style.setProperty('left',r.left+'px','important');
   card.style.setProperty('top',r.top+'px','important');
   card.style.setProperty('right','auto','important');
   card.style.setProperty('bottom','auto','important');
   applyTransform();
   dragState={id:e.pointerId,sx:e.clientX,sy:e.clientY,left:r.left,top:r.top,w:r.width,h:r.height};
   try{card.setPointerCapture(e.pointerId)}catch(_){}
 }
 function moveDrag(e){
   if(!dragState||e.pointerId!==dragState.id)return;
   e.preventDefault();
   const x=clamp(dragState.left+e.clientX-dragState.sx,8,Math.max(8,innerWidth-dragState.w-8));
   const y=clamp(dragState.top+e.clientY-dragState.sy,8,Math.max(8,innerHeight-dragState.h-8));
   card.style.setProperty('left',x+'px','important');
   card.style.setProperty('top',y+'px','important');
 }
 function endDrag(e){
   if(!dragState||e.pointerId!==dragState.id)return;
   dragState=null; saveState();
   try{card.releasePointerCapture(e.pointerId)}catch(_){}
 }

 // Drag from the Move button OR any non-interactive empty area of the card.
 card.addEventListener('pointerdown',startDrag);
 card.addEventListener('pointermove',moveDrag);
 card.addEventListener('pointerup',endDrag);
 card.addEventListener('pointercancel',endDrag);

 // Keep the resize handle from changing the card's scale. It changes scale proportionally instead.
 if(resize)resize.addEventListener('pointerdown',e=>{
   if(innerWidth<=760)return;
   e.preventDefault();e.stopPropagation();
   const r=card.getBoundingClientRect(),sx=e.clientX,baseW=r.width,baseScale=scale;
   resize.setPointerCapture(e.pointerId);
   const mv=ev=>{scale=clamp(baseScale*((baseW+ev.clientX-sx)/baseW),.45,1.10);applyTransform()};
   const end=()=>{resize.removeEventListener('pointermove',mv);saveState()};
   resize.addEventListener('pointermove',mv);
   resize.addEventListener('pointerup',end,{once:true});
   resize.addEventListener('pointercancel',end,{once:true});
 });

 restore();
})();
</script>
<script id="talkabee-hotspot-custom-sound">
(function(){
 if(window.__talkabeeHotspotCustomSound)return;window.__talkabeeHotspotCustomSound=true;
 const SEL='.hotspot,.home-hotspot,.yacht-hotspot,.hotspots button,.train-hotspots button';
 let timer=0,current=null;
 function stop(){clearTimeout(timer);if(current){try{current.pause();current.currentTime=0}catch(e){}current=null}}
 document.addEventListener('click',function(ev){
  if(document.body.classList.contains('tb-hs-editing'))return;
  const h=ev.target.closest&&ev.target.closest(SEL);if(!h||!h.dataset.sound)return;
  stop();const src=h.dataset.sound;
  // Keep Talk A Bee order: translated object speech first, then the real sound.
  timer=setTimeout(function(){const a=new Audio(src);current=a;a.play().catch(()=>{});a.onended=function(){if(current===a)current=null}},1500);
 },false);
})();
</script>
