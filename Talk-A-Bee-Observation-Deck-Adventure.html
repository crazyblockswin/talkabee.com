<script id="talkabee-learning-language-sync">
(function(){
  'use strict';
  const KEY='talkabee-learn-language';
  function control(){return document.getElementById('lang');}
  function supported(el,value){return Array.from(el.options).some(option=>option.value===value);}
  function restore(){
    const el=control(); if(!el)return;
    const saved=localStorage.getItem(KEY);
    if(saved && supported(el,saved) && el.value!==saved){
      el.value=saved;
      // Update the displayed lesson without generating a fake user change.
      if(typeof window.showWord==='function' && typeof window.lastWord==='string' && window.lastWord) window.showWord(window.lastWord);
    }
  }
  function bind(){
    const el=control(); if(!el || el.dataset.tbLanguageSyncBound)return;
    el.dataset.tbLanguageSyncBound='1';
    el.addEventListener('change',function(){
      if(supported(el,el.value))localStorage.setItem(KEY,el.value);
    },true);
    restore();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);
  else bind();
  window.addEventListener('pageshow',restore);
  window.addEventListener('storage',function(event){if(event.key===KEY)restore();});
})();
</script>
