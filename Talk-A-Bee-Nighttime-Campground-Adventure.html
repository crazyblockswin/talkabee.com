const campgroundSounds={bee:"bee.mp3",bear:"dog-bark.mp3",creek:"creek.mp3",trees:"crickets-birds.mp3",stars:"crickets-birds.mp3"};
let sceneSound=null;
function playCampSound(id){const file=campgroundSounds[id];if(!file)return;if(sceneSound){sceneSound.pause();sceneSound.currentTime=0}sceneSound=new Audio("sounds/"+file);sceneSound.volume=.82;sceneSound.play().catch(()=>{})}

const langSel=document.getElementById("lang"),voiceSel=document.getElementById("voice");
const title=document.getElementById("title"),prompt=document.getElementById("prompt"),line=document.getElementById("line"),translation=document.getElementById("translation"),status=document.getElementById("status"),world=document.getElementById("world");
let lastWord="campground",challenge=-1,activeLesson="";
function fillVoices(){if(!("speechSynthesis" in window))return;const base=CODES[langSel.value].split("-")[0].toLowerCase();const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(base));voiceSel.innerHTML='<option>Browser Default</option>'+vs.map(v=>`<option>${v.name}</option>`).join("")}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=fillVoices;fillVoices()}
function speak(t,rate=.82,onend=null){if(!t||!("speechSynthesis" in window)){if(onend)onend();return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=CODES[langSel.value];u.rate=rate;const v=speechSynthesis.getVoices().find(v=>v.name===voiceSel.value);if(v)u.voice=v;if(onend){u.onend=onend;u.onerror=onend}setTimeout(()=>speechSynthesis.speak(u),40)}catch(e){if(onend)onend()}}

document.querySelectorAll(".hotspot").forEach(b=>b.onclick=()=>{activeLesson="";const key=b.dataset.word;showWord(key);let soundDone=false;const playSound=()=>{if(soundDone)return;soundDone=true;playCampSound(key)};speak(WORDS[langSel.value][key]||EN[key],.82,playSound);setTimeout(playSound,1400);if(challenge>=0){if(key===challengeOrder[challenge]){status.textContent="✓ Nice find!";status.style.color="#9dffbf"}else{status.textContent="Not that one — keep looking.";status.style.color="#ffe28a"}}});
document.getElementById("discovery").onclick=()=>{activeLesson="";challenge=-1;world.classList.remove("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.remove("target"));title.textContent="Click & Discover";prompt.textContent="Click any object in the scene to hear its name.";status.textContent=""};
document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{activeLesson="";challenge=+b.dataset.ch;world.classList.add("challenge-mode");document.querySelectorAll(".hotspot").forEach(h=>h.classList.toggle("target",h.dataset.word===challengeOrder[challenge]));title.textContent="Challenge "+(challenge+1)+" of 6";prompt.textContent=b.textContent.replace(/^\d+\.\s*/,"");status.textContent=""});
const lessons={
en:{arrive:["We are camping by the lake.", "Our campsite is ready for the night."],fire:["Everyone is sitting around the campfire.", "The fire is warm and bright."],food:["We are roasting marshmallows.", "Be careful near the campfire."],night:["Look at the moon and the stars.", "The mountains are quiet at night."],gear:["We have a tent, lantern, cooler, and bicycles.", "The camping gear is ready."],family:["Grandma, Grandpa, family, and friends are together.", "Bear is relaxing beside the campfire."]},
es:{arrive:["Estamos acampando junto al lago.", "Nuestro campamento está listo para la noche."],fire:["Todos están sentados alrededor de la fogata.", "El fuego es cálido y brillante."],food:["Estamos asando malvaviscos.", "Ten cuidado cerca de la fogata."],night:["Mira la luna y las estrellas.", "Las montañas están tranquilas por la noche."],gear:["Tenemos una tienda de campaña, una linterna, una nevera y bicicletas.", "El equipo de campamento está listo."],family:["La abuela, el abuelo, la familia y los amigos están juntos.", "Bear está descansando junto a la fogata."]},
fr:{arrive:["Nous campons près du lac.", "Notre camping est prêt pour la nuit."],fire:["Tout le monde est assis autour du feu de camp.", "Le feu est chaud et lumineux."],food:["Nous faisons griller des guimauves.", "Fais attention près du feu de camp."],night:["Regarde la lune et les étoiles.", "Les montagnes sont calmes la nuit."],gear:["Nous avons une tente, une lanterne, une glacière et des vélos.", "Le matériel de camping est prêt."],family:["Grand-mère, grand-père, la famille et les amis sont ensemble.", "Bear se repose près du feu de camp."]},

<script id="talkabee-inclusive-browser-voices-v1">
(()=>{
  if(!('speechSynthesis' in window))return;
  const voiceSelects=()=>[...document.querySelectorAll('select')].filter(s=>/voice/i.test((s.id||'')+' '+(s.name||'')+' '+(s.className||'')));
  function fillAllBrowserVoices(){
    const voices=speechSynthesis.getVoices(); if(!voices.length)return;
    voiceSelects().forEach(sel=>{
      const chosen=sel.value;
      sel.innerHTML='';
      const d=document.createElement('option'); d.value=''; d.textContent='Browser Default'; sel.appendChild(d);
      voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+(v.lang?' — '+v.lang:'');sel.appendChild(o)});
      if([...sel.options].some(o=>o.value===chosen))sel.value=chosen;
    });
  }
  speechSynthesis.addEventListener?.('voiceschanged',fillAllBrowserVoices);
  window.addEventListener('load',()=>{fillAllBrowserVoices();setTimeout(fillAllBrowserVoices,150);setTimeout(fillAllBrowserVoices,600);setTimeout(fillAllBrowserVoices,1500)});
  document.addEventListener('change',e=>{if(e.target&&e.target.tagName==='SELECT'&&!/voice/i.test((e.target.id||'')+' '+(e.target.name||'')+' '+(e.target.className||'')))setTimeout(fillAllBrowserVoices,0)},true);
})();
</script>
